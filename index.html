,["1","1596526473647"],["2","1596526478593"],["3","1597394364782"]]}],"七年级":[{"p":"《论语》十二章","au":"孔子及其弟子","dy":"先秦","c":"子曰：\"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？\"\n子曰：\"温故而知新，可以为师矣。\"\n子曰：\"学而不思则罔，思而不学则殆。\"\n子曰：\"知之者不如好之者，好之者不如乐之者。\"\n子曰：\"三人行，必有我师焉。择其善者而从之，其不善者而改之。\"\n子曰：\"吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。\"\n子曰：\"贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！\"\n子曰：\"饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。\"\n子在川上曰：\"逝者如斯夫，不舍昼夜。\"\n子曰：\"三军可夺帅也，匹夫不可夺志也。\"\n子夏曰：\"博学而笃志，切问而近思，仁在其中矣。","a":[["0","1597302870649"],["1","1596880652844"],["2","1596512165224"],["3","1598082152830"],["4","1597303586407"]],"v":["1597972717381045259"]},{"p":"割席断交","au":"刘义庆","dy":"南北朝","c":"管宁、华歆共园中锄菜，见地有片金，管挥锄与瓦石不异，华捉而掷去之。又尝同席读书，有乘轩冕过门者，宁读如故，歆废书出看。宁割席分坐曰：\"子非吾友也。","a":[["0","1591171419833"],["1","1596512233928"],["2","1596512253366"],["3","1598082198095"],["4","1596855201744"]]},{"p":"咏雪","au":"刘义庆","dy":"南北朝","c":"谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：\"白雪纷纷何所似？\"兄子胡儿曰：\"撒盐空中差可拟。\"兄女曰：\"未若柳絮因风起。\"公大笑乐。即公大兄无奕女，左将军王凝之妻也。","a":[["0","1591171324831"],["1","1596512481164"],["2","1596512500290"],["3","1597984109280"],["4","1596855472250"]],"v":["1597329731462008357"]},{"p":"夜雨寄北","au":"李商隐","dy":"唐","c":"君问归期未有期，\n巴山夜雨涨秋池。\n何当共剪西窗烛，\n却话巴山夜雨时。","a":[["0","1591170426338"],["1","1596510719888"],["2","1596510739729"],["3","1597985355085"],["5","1596510751192"],["4","1596855169815"]]},{"p":"天净沙·秋思","au":"马致远","dy":"元","c":"枯藤老树昏鸦，\n小桥流水人家，\n古道西风瘦马。\n夕阳西下，\n断肠人在天涯。","a":[["0","1589446049314"],["1","1596512597282"],["2","1603108757958"],["3","1597983997658"],["5","1596512668423"],["4","1596855328960"]],"v":["1597225521250033098"]},{"p":"孙权劝学","au":"司马光","dy":"宋","c":"初，权谓吕蒙曰：\"卿今当涂掌事，不可不学！\"蒙辞以军中多务。权曰：\"孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。\"蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：\"卿今者才略，非复吴下阿蒙！\"蒙曰：\"士别三日，即更刮目相待，大兄何见事之晚乎！\"肃遂拜蒙母，结友而别。","a":[["0","1597300572066"],["1","1596510427558"],["2","1596510447359"]]},{"p":"晚春","au":"韩愈","dy":"唐","c":"草树知春不久归，\n百般红紫斗芳菲。\n杨花榆荚无才思，\n惟解漫天作雪飞。","a":[["0","1583724552477"],["1","1596509376468"],["2","1596509400042"],["3","1597984866309"]]},{"p":"望岳","au":"杜甫","dy":"唐","c":"岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。","a":[["0","1584094339088"],["1","1596508787057"],["3","1597984714302"],["5","1596508885514"]],"v":["1596467667888037270"]},{"p":"木兰诗","au":"北朝民歌","dy":"南北朝","c":"唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。\n问女何所思，问女何所忆。女亦无所思，女亦无所忆。\n昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。\n阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。\n旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。\n旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。\n可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。\n爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。\n开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。\n出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？","a":[["0","1584264674834"],["1","1597300972157"],["2","1597300961425"],["3","1597984984912"]],"v":["1598003508938032074"]},{"p":"次北固山下","au":"王湾","dy":"唐","c":"客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达？归雁洛阳边。","a":[["0","1589444998960"],["1","1596512761265"],["2","1596512777748"],["3","1597982259542"],["4","1596855139544"]],"v":["1597225421713027471"]},{"p":"江南逢李龟年","au":"杜甫","dy":"唐","c":"岐王宅里寻常见，\n崔九堂前几度闻。\n正是江南好风景，\n落花时节又逢君。","a":[["0","1591170189717"],["1","1596511911334"],["2","1597311028832"],["3","1598082116960"],["5","1596511956906"],["4","1596855495936"]]},{"p":"泊秦淮","au":"杜牧","dy":"唐","c":"烟笼寒水月笼沙，\n夜泊秦淮近酒家。\n商女不知亡国恨，\n隔江犹唱后庭花。","a":[["0","1584094233982"],["1","1596508194924"],["2","1596877902299"],["3","1598082356438"],["5","1596508242918"]]},{"p":"游山西村","au":"陆游","dy":"宋","c":"莫笑农家腊酒浑，\n丰年留客足鸡豚。\n山重水复疑无路，\n柳暗花明又一村。\n箫鼓追随春社近，\n衣冠简朴古风存。\n从今若许闲乘月，\n拄杖无时夜叩门。","a":[["0","1584183064164"],["1","1597301813870"],["3","1597984643097"],["5","1597301831545"]],"v":["1597290829043049959"]},{"p":"狼","au":"蒲松龄","dy":"清","c":"一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。","a":[["0","1591171163780"],["1","1596511248077"],["2","1596511276045"],["3","1598081456382"],["4","1596855251101"]],"v":["1597204628143075255"]},{"p":"登幽州台歌","au":"陈子昂","dy":"唐","c":"前不见古人，\n后不见来者。\n念天地之悠悠，\n独怆然而涕下。","a":[["0","1583724706168"],["1","1597301596799"],["3","1597984734809"],["5","1597301635722"]]},{"p":"秋夕","au":"杜牧","dy":"唐","c":"银烛秋光冷画屏，\n轻罗小扇扑流萤。\n天阶夜色凉如水，\n卧看牵牛织女星。","a":[["0","1591171090689"],["1","1596511096284"],["2","1596511111381"],["3","1598081368292"],["4","1596855354643"]]},{"p":"秋词","au":"刘禹锡","dy":"唐","c":"自古逢秋悲寂寥，\n我言秋日胜春朝。\n晴空一鹤排云上，\n便引诗情到碧霄。","a":[["0","1591170983538"],["1","1596510825240"],["2","1596510855310"],["3","1598081130467"]]},{"p":"竹里馆","au":"王维","dy":"唐","c":"独坐幽篁里，\n弹琴复长啸。\n深林人不知，\n明月来相照。","a":[["0","1583731444138"],["1","1596509929799"],["2","1596509949622"],["3","1583731452358"],["5","1596509956763"]]},{"p":"约客","au":"赵师秀","dy":"宋","c":"黄梅时节家家雨，\n青草池塘处处蛙。\n有约不来过夜半，\n闲敲棋子落灯花。","a":[["0","1584266141294"],["1","1596507643266"],["2","1596507668175"]]},{"p":"观沧海","au":"曹操","dy":"汉","c":"东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。","a":[["0","1591170043711"],["1","1596513006110"],["2","1596513038642"],["5","1596513060329"],["4","1596855227810"]],"v":["1597204366214063804"]},{"p":"诫子书","au":"诸葛亮","dy":"三国","c":"夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！","a":[["0","1591171205425"],["1","1596511342751"],["2","1596511361635"],["3","1598081508485"]],"v":["1597229822967080993"]},{"p":"闻王昌龄左迁龙标遥有此寄","au":"李白","dy":"唐","c":"杨花落尽子规啼，\n闻道龙标过五溪。\n我寄愁心与明月，\n随君直到夜郎西。","a":[["0","1589444888851"],["1","1596512897350"],["2","1603108812640"],["3","1597981345886"],["4","1596855377776"]],"v":["1597225592174033120"]},{"p":"陈太丘与友期","au":"刘义庆","dy":"南北朝","c":"陈太丘与友期行，期日中，过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：\"尊君在不？\"答曰：\"待君久不至，已去。\"友人便怒：\"非人哉！与人期行，相委而去。\"元方曰：\"君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。\"友人惭，下车引之。元方入门不顾。","a":[["0","1591171365002"],["1","1596512407766"],["2","1596512428263"],["3","1598082710825"]],"v":["1597229686279099125"]},{"p":"鹊桥仙","au":"秦观","dy":"宋","c":"纤云弄巧，飞星传恨，银汉迢迢暗度。\n金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。\n两情若是久长时，又岂在朝朝暮暮。","a":[["0","1591171014844"],["1","1596510911353"],["2","1596510937905"],["3","1598081214130"]]},{"p":"蒹葭","au":"佚名","dy":"先秦《诗经》","c":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。\n溯洄从之，道阻且长。溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。\n溯洄从之，道阻且跻。溯游从之，宛在水中坻。\n蒹葭采采，白露未已。所谓伊人，在水之涘。\n溯洄从之，道阻且右。溯游从之，宛在水中沚。","a":[["0","1584361592162"],["1","1597391590620"],["2","1597391631999"],["3","1597391556415"],["5","1597391649842"]]},{"p":"十五从军征","au":"佚名","dy":"汉乐府","c":"十五从军征，八十始得归。\n道逢乡里人：家中有阿谁？\n遥看是君家，松柏冢累累。\n兔从狗窦入，雉从梁上飞。\n中庭生旅谷，井上生旅葵。\n舂谷持作饭，采葵持作羹。\n羹饭一时熟，不知贻阿谁！\n出门东向看，泪落沾我衣。","a":[["0","1584364447405"],["1","1596606939590"],["2","1596606958377"],["3","1597414491450"]]},{"p":"送杜少府之任蜀州","au":"王勃","dy":"唐","c":"城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。","a":[["0","1584363210846"],["1","1596523336986"],["2","1596525777061"],["3","1597398463139"],["5","1597398476380"]]},{"p":"卖炭翁","au":"白居易","dy":"唐","c":"卖炭翁，伐薪烧炭南山中。\n满面尘灰烟火色，两鬓苍苍十指黑。\n卖炭得钱何所营？身上衣裳口中食。\n可怜身上衣正单，心忧炭贱愿天寒。\n夜来城外一尺雪，晓驾炭车辗冰辙。\n牛困人饥日已高，市南门外泥中歇。\n翩翩两骑来是谁？黄衣使者白衫儿。\n手把文书口称敕，回车叱牛牵向北。\n一车炭，千余斤，宫使驱将惜不得。\n半匹红绡一丈绫，系向牛头充炭直。","a":[["0","1591583024854"],["1","1596519898243"],["2","1596519928363"],["3","1597398825147"]]},{"p":"茅屋为秋风所破歌","au":"杜甫","dy":"唐","c":"八月秋高风怒号，卷我屋上三重茅。\n茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。\n南村群童欺我老无力，忍能对面为盗贼。\n公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。\n俄顷风定云墨色，秋天漠漠向昏黑。\n布衾多年冷似铁，娇儿恶卧踏里裂。\n床头屋漏无干处，雨脚如麻未断绝。\n自经丧乱少睡眠，长夜沾湿何由彻！\n安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。\n呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！","a":[["0","1597388231576"],["1","1596520033053"],["2","1596520070514"],["3","1597394037215"],["5","1596520092419"]]},{"p":"南乡子·登京口北固亭有怀","au":"辛弃疾","dy":"宋","c":"何处望神州？满眼风光北固楼。\n千古兴亡多少事？悠悠。不尽长江滚滚流。\n年少万兜鍪，坐断东南战未休。\n天下英雄谁敌手？曹刘。生子当如孙仲谋。","a":[["0","1584364685168"],["1","1596606557458"],["2","1596606604064"],["3","1597414819170"]]},{"p":"破阵子·为陈同甫赋壮词以寄之","au":"辛弃疾","dy":"宋","c":"醉里挑灯看剑，梦回吹角连营。\n八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。\n了却君王天下事，赢得生前身后名。可怜白发生！","a":[["0","1596620632530"],["1","1596620659584"],["2","1596620667033"],["3","1596620660613"]]},{"p":"爱莲说","au":"周敦颐","dy":"宋","c":"水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。\n予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。\n予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。\n噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。","a":[["0","1584264372044"],["1","1595925582400"],["2","1595925635740"],["3","1597984758341"],["5","1596165086287"]]},{"p":"峨眉山月歌","au":"李白","dy":"唐","c":"峨眉山月半轮秋，影入平羌江水流。\n夜发清溪向三峡，思君不见下渝州。","a":[["0","1591170139503"],["1","1596512021925"],["2","1596512044816"],["3","1598082088447"],["5","1596512054773"],["4","1596855108504"]]},{"p":"春夜洛城闻笛","au":"李白","dy":"唐","c":"谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。","a":[["0","1583726140399"],["1","1596509567100"],["2","1596509585867"],["3","1583726146924"]]},{"p":"夜上受降城闻笛","au":"李益","dy":"唐","c":"回乐烽前沙似雪，受降城外月如霜。\n不知何处吹芦管，一夜征人尽望乡。","a":[["0","1591170281108"],["1","1596511424057"],["2","1596511735944"],["3","1598081572845"],["5","1596511513719"],["4","1596855446143"]]},{"p":"七夕","au":"杜牧","dy":"唐","c":"银烛秋光冷画屏，\n轻罗小扇扑流萤。\n天阶夜色凉如水，\n卧看牵牛织女星。","a":[["0","1591171090689"],["1","1596511096284"],["2","1596511111381"],["3","1598081368292"],["4","1596855354643"],["0","1591171053761"],["1","1596510998270"],["2","1596511022163"],["3","1598081322836"]]},{"p":"伯牙绝弦","au":"列子","dy":"先秦","c":"伯牙鼓琴，钟子期听之。\n方鼓琴而志在太山，钟子期曰：\"善哉乎鼓琴！巍巍乎若太山。\"\n少选之间，而志在流水，钟子期又曰：\"善哉乎鼓琴！汤汤乎若流水。\"\n钟子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。","a":[["0","1591345576091"],["1","1596512320365"],["2","1596512339172"],["3","1598082235380"]]},{"p":"十一月四日风雨大作（其二）","au":"陆游","dy":"宋","c":"僵卧孤村不自哀，\n尚思为国戍轮台。\n夜阑卧听风吹雨，\n铁马冰河入梦来。","a":[["0","1591170384171"],["1","1596510636639"],["2","1596510663344"],["3","1597985219724"],["5","1596510677129"],["4","1596855399573"]]},{"p":"卖油翁","au":"欧阳修","dy":"宋","c":"陈康肃公尧咨善射，当世无双，公亦以此自矜。\n尝射于家圃，有卖油翁释担而立，睨之，久而不去。\n见其发矢十中八九，但微颔之。\n康肃问曰：\"汝亦知射乎？吾射不亦精乎？\"\n翁曰：\"无他，但手熟尔。\"\n康肃忿然曰：\"尔安敢轻吾射！\"\n翁曰：\"以我酌油知之。\"\n乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。\n因曰：\"我亦无他，惟手熟尔。\"\n康肃笑而遣之。","a":[["0","1584264568073"],["1","1596510058609"],["2","1596510083059"],["3","1584264586027"]]},{"p":"己亥杂诗（其五）","au":"龚自珍","dy":"清","c":"浩荡离愁白日斜，\n吟鞭东指即天涯。\n落红不是无情物，\n化作春泥更护花。","a":[["0","1591166397531"],["1","1596524107652"],["2","1596524112613"],["3","1597388716238"],["4","1596854174694"],["0","1584267513409"],["1","1596508508379"],["2","1596508536995"],["3","1597984606254"],["5","1596508558196"],["4","1597301981298"]]},{"p":"杞人忧天","au":"列子","dy":"先秦","c":"杞国有人忧天地崩坠，身亡所寄，废寝食者。\n又有忧彼之所忧者，因往晓之，曰：\"天，积气耳，亡处亡气。\n若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？\"\n其人曰：\"天果积气，日月星宿，不当坠耶？\"\n晓之者曰：\"日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。\"\n其人曰：\"地坏坏？\"\n晓之者曰：\"地，积块耳，充塞四虚，亡处亡块。\n若躇步跐蹈，终日在地上行止，奈何忧其坏？\"\n其人舍然大喜，晓之者亦舍然大喜。","a":[["0","1597301324083"],["1","1596881572855"],["2","1596881573418"]]},{"p":"河中石兽","au":"纪昀","dy":"清","c":"沧州南一寺临河干，山门圮于河，二石兽并沉焉。\n阅十余岁，僧募金重修，求二石兽于水中，竟不可得。\n以为顺流下矣，棹数小舟，曳铁钯，寻十余里无迹。\n一讲学家设帐寺中，闻之笑曰：\"尔辈不能究物理，是非木杮，岂能为暴涨携之去？\n乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。\n沿河求之，不亦颠乎？\"\n众服为确论。\n一老河兵闻之，又笑曰：\"凡河中失石，当求之于上流。\n盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴，\n渐激渐深，至石之半，石必倒掷坎穴中。\n如是再啮，石又再转。转转不已，遂反溯流逆上矣。\n求之下流，固颠；求之地中，不更颠乎？\"\n如其言，果得于数里外。\n然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？","a":[["0","1597302193325"],["1","1596508340517"],["2","1596508409893"],["3","1597984415080"]]},{"p":"潼关","au":"谭嗣同","dy":"清","c":"终古高云簇此城，\n秋风吹散马蹄声。\n河流大野犹嫌束，\n山入潼关解不平。","a":[["0","1597416828936"],["1","1596606262809"],["2","1596606314070"],["3","1597415938568"],["0","1591170352647"],["1","1597301434996"],["2","1597301445439"],["3","1597985152726"]]},{"p":"狼子野心","au":"蒲松龄","dy":"清","c":"有富室偶得二小狼，与家犬杂畜，亦与犬相安。\n稍长，亦颇驯，竟忘其为狼。\n一日，主人昼寝厅事，闻群犬呜呜作怒声，惊起周视，无一人。\n再就枕将寐，犬又如前。乃伪睡以俟。则二狼伺其未觉，将啮其喉，犬阻之不使前也。\n乃杀而取其革。\n狼子野心，信不诬哉！然野心不过遁逸耳，阳为亲昵而阴怀不测，更不止于野心矣。","a":[["0","1591171130434"],["1","1596511163470"],["2","1596511186265"],["3","1598081410653"],["4","1596855298567"]]},{"p":"登飞来峰","au":"王安石","dy":"宋","c":"飞来山上千寻塔，\n闻说鸡鸣见日升。\n不畏浮云遮望眼，\n自缘身在最高层。","a":[["0","1584181947964"],["1","1596508696453"],["2","1596508717064"],["3","1597984678985"]]},{"p":"穿井得一人","au":"吕氏春秋","dy":"先秦","c":"宋之丁氏，家无井而出溉汲，常一人居外。\n及其家穿井，告人曰：\"吾穿井得一人。\"\n有闻而传之者曰：\"丁氏穿井得一人。\"\n国人道之，闻之于宋君。\n宋君令人问之于丁氏，丁氏对曰：\"得一人之使，非得一人于井中也。\"\n求闻之若此，不若无闻也。","a":[["0","1608878718224"],["1","1596881414905"],["2","1596881486661"],["3","1609141963435"]]},{"p":"行军九日思长安故园","au":"岑参","dy":"唐","c":"强欲登高去，\n无人送酒来。\n遥怜故园菊，\n应傍战场开。","a":[["0","1591170247661"],["1","1596511807865"],["2","1596511843276"],["3","1598081630343"],["4","1596855421068"]]},{"p":"贾生","au":"李商隐","dy":"唐","c":"宣室求贤访逐臣，\n贾生才调更无伦。\n可怜夜半虚前席，\n不问苍生问鬼神。","a":[["0","1584095788915"],["1","1596508105718"],["2","1596508128245"],["3","1597895768013"]]},{"p":"过松源晨炊漆公店（其五）","au":"杨万里","dy":"宋","c":"莫言下岭便无难，\n赚得行人错喜欢。\n正入万山圈子里，\n一山放过一山拦。","a":[["0","1584265143799"],["1","1596507930526"],["2","1596508032355"],["3","1598082323297"],["5","1596507983295"]]},{"p":"逢入京使","au":"岑参","dy":"唐","c":"故园东望路漫漫，\n双袖龙钟泪不干。\n马上相逢无纸笔，\n凭君传语报平安。","a":[["0","1583330673804"],["1","1596509471659"],["2","1596509487083"],["3","1597984898895"]]},{"p":"陋室铭","au":"刘禹锡","dy":"唐","c":"山不在高，有仙则名。\n水不在深，有龙则灵。\n斯是陋室，惟吾德馨。\n苔痕上阶绿，草色入帘青。\n谈笑有鸿儒，往来无白丁。\n可以调素琴，阅金经。\n无丝竹之乱耳，无案牍之劳形。\n南阳诸葛庐，西蜀子云亭。\n孔子云：何陋之有？","a":[["0","1584264467086"],["1","1596509304078"],["2","1596509322165"],["5","1596509332001"]]}],"八年级":[{"p":"《新乐府》序","au":"白居易","dy":"唐","c":"凡九千二百五十二言，断为五十篇。篇无定句，句无定字，系于意，不系于文。首句标其目，卒章显其志，《诗》三百之义也。其辞质而径，欲见之者易谕也。其言直而切，欲闻之者深诫也。其事核而实，使采之者传信也。其体顺而肆，可以播于乐章歌曲也。总而言之，为君、为臣、为民、为物、为事而作，不为文而作也。","a":[["0","1597409556604"],["1","1596519785835"],["2","1596519817408"],["3","1597395977824"]]},{"p":"三峡","au":"郦道元","dy":"南北朝","c":"自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影，绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：\"巴东三峡巫峡长，猿鸣三声泪沾裳。","a":[["0","1591172369310"],["1","1596595975825"],["2","1596596019211"],["3","1597419336951"],["4","1596857018072"]],"v":["1597278142412064004"]},{"p":"上令封德彝举贤","au":"吴兢","dy":"唐","c":"上令封德彝举贤。久无所举。上诘之，对曰：\"非不尽心，但于今未有奇才耳。\"上曰：\"君子用人如器，各取所长。古之致治者，岂借才于异代乎？正患己不能知，安可诬一世之人！","a":[["0","1591583876170"],["1","1596520816178"],["2","1596520838680"],["3","1597396361270"]]},{"p":"上李邕","au":"李白","dy":"唐","c":"大鹏一日同风起，\n扶摇直上九万里。\n假令风歇时下来，\n犹能簸却沧溟水。\n世人见我恒殊调，\n闻余大言皆冷笑。\n宣父犹能畏后生，\n丈夫未可轻年少。","a":[["0","1591583812018"],["1","1596521942306"],["2","1596521971713"],["3","1591583812770"],["5","1596521682147"]]},{"p":"与朱元思书","au":"吴均","dy":"南北朝","c":"风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。","a":[["0","1591172432816"],["1","1596595379232"],["2","1596595430554"],["3","1597419637620"],["4","1597311178258"]],"v":["1597278533860001973"]},{"p":"使至塞上","au":"王维","dy":"唐","c":"单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。","a":[["0","1591174891233"],["1","1596533278005"],["2","1596533365701"],["3","1597419795747"],["5","1596533456604"],["4","1596856490289"]],"v":["1597278229412044776"]},{"p":"关雎","au":"佚名","dy":"先秦","c":"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n参差荇菜，左右流之。窈窕淑女，寤寐求之。\n求之不得，寤寐思服。悠哉悠哉，辗转反侧。\n参差荇菜，左右采之。窈窕淑女，琴瑟友之。\n参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。","a":[["0","1584361135944"],["1","1596526632253"],["2","1596527161349"],["3","1597421094505"],["5","1596526696830"]],"v":["1597279511242099978"]},{"p":"商鞅立木","au":"司马光","dy":"宋","c":"商鞅变法，令既具，未布，恐民之不信己，乃立三丈之木于国都市南门，募民有能徙置北门者予十金。民怪之，莫敢徙。复曰：\"能徙者予五十金。\"有一人徙之，辄予五十金，以明不欺。卒下令。","a":[["0","1597583980798"],["1","1597583985859"],["2","1597583990481"]]},{"p":"富贵不能淫","au":"孟子及其弟子","dy":"先秦","c":"景春曰：\"公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。\"孟子曰：\"是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。","a":[["0","1591175192054"],["1","1596531911495"],["2","1596531933597"],["3","1597420274684"]],"v":["1596767629343041896"]},{"p":"式微","au":"佚名","dy":"先秦","c":"式微，式微，胡不归？\n微君之故，胡为乎中露？\n式微，式微，胡不归？\n微君之躬，胡为乎泥中？","a":[["0","1584361729745"],["1","1596526116050"],["2","1596526164225"],["3","1597421157294"]]},{"p":"得道多助，失道寡助","au":"孟子及其弟子","dy":"先秦","c":"天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。","a":[["0","1591582357805"],["1","1596532052567"],["2","1596532097508"],["3","1597420223535"]],"v":["1597937700525013778"]},{"p":"愚公移山","au":"列子","dy":"先秦","c":"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：\"吾与汝毕力平险，指通豫南，达于汉阴，可乎？\"杂然相许。其妻献疑曰：\"以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？\"杂曰：\"投诸渤海之尾，隐土之北。\"遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：\"甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？\"北山愚公长息曰：\"汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？\"河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。","a":[["0","1591175264467"],["1","1596531490661"],["2","1596531508957"],["3","1597584382165"],["4","1596856644117"]],"v":["1596695424441004448"]},{"p":"春望","au":"杜甫","dy":"唐","c":"国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。","a":[["0","1591175383513"],["1","1596530771865"],["2","1596531000443"],["3","1597420725706"],["4","1596856979141"]],"v":["1597936917666016994"]},{"p":"望洞庭湖赠张丞相","au":"孟浩然","dy":"唐","c":"八月湖水平，涵虚混太清。\n气蒸云梦泽，波撼岳阳城。\n欲济无舟楫，端居耻圣明。\n坐观垂钓者，徒有羡鱼情。","a":[["0","1585790518629"],["1","1596522211427"],["2","1596522935115"],["3","1597421611819"]]},{"p":"核舟记","au":"魏学洢","dy":"明","c":"明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。","a":[["0","1586402958745"],["1","1596527244031"],["2","1596527253218"],["5","1596527303428"]]},{"p":"桃花源记并诗（上）","au":"陶渊明","dy":"晋","c":"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。","a":[["0","1597216894093"],["1","1597216880544"],["2","1597210235554"],["0","1597217013413"],["1","1597217019178"],["2","1597541973637"],["3","1597420988778"]]},{"p":"渔家傲","au":"李清照","dy":"宋","c":"天接云涛连晓雾，星河欲转千帆舞。\n仿佛梦魂归帝所，闻天语，殷勤问我归何处。\n我报路长嗟日暮，学诗谩有惊人句。\n九万里风鹏正举。风休住，蓬舟吹取三山去！","a":[["0","1591175486978"],["1","1596530315352"],["2","1596530363089"],["4","1597539644486"]],"v":["1597938033204034509"]},{"p":"渡荆门送别","au":"李白","dy":"唐","c":"渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍怜故乡水，万里送行舟。","a":[["0","1591174951158"],["1","1596533095124"],["2","1596533164887"],["3","1597419852761"],["4","1596858834776"]],"v":["1597277943655003410"]},{"p":"生于忧患，死于安乐","au":"孟子及其弟子","dy":"先秦","c":"舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。","a":[["0","1591175222807"],["1","1596613644104"],["2","1596531777140"],["3","1597420325175"],["4","1596857495666"]],"v":["1596762198266094673"]},{"p":"石壕吏","au":"杜甫","dy":"唐","c":"暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。\n吏呼一何怒！妇啼一何苦！\n听妇前致词：三男邺城戍。一男附书至，二男新战死。存者且偷生，死者长已矣！室中更无人，惟有乳下孙。有孙母未去，出入无完裙。老妪力虽衰，请从吏夜归，急应河阳役，犹得备晨炊。\n夜久语声绝，如闻泣幽咽。天明登前途，独与老翁别。","a":[["0","1597409477399"],["1","1597409492148"],["2","1597390652162"],["3","1597409506776"]]},{"p":"礼记·檀弓故事二则（上）","au":"戴圣","dy":"汉","c":"苛政猛于虎也。孔子过泰山侧，有妇人哭于墓者而哀。夫子式而听之，使子路问之曰：\"子之哭也，壹似重有忧者。\"而曰：\"然。昔者吾舅死于虎，吾夫又死焉，今吾子又死焉。\"夫子曰：\"何为不去也？\"曰：\"无苛政。\"夫子曰：\"小子识之：苛政猛于虎也。","a":[["0","1597216696451"],["1","1597216695261"],["2","1597216695096"],["3","1597216698180"],["0","1597216744204"],["1","1597216757571"],["2","1597216756852"],["3","1597216752988"]]},{"p":"答谢中书书","au":"陶弘景","dy":"南北朝","c":"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。","a":[["0","1589941348865"],["1","1596595795326"],["2","1596595848574"],["3","1597584318562"]],"v":["1597277854970043857"]},{"p":"记承天寺夜游","au":"苏轼","dy":"宋","c":"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。","a":[["0","1589943379720"],["1","1596595625074"],["2","1596595696692"],["3","1597419584148"]],"v":["1596767438336012535"]},{"p":"赠从弟（其二）","au":"刘桢","dy":"汉","c":"亭亭山上松，瑟瑟谷中风。\n风声一何盛，松枝一何劲！\n冰霜正惨凄，终岁常端正。\n岂不罹凝寒？松柏有本性。","a":[["0","1591175088729"],["1","1596532486019"],["2","1596532515266"],["3","1597422556884"]]},{"p":"赤壁","au":"杜牧","dy":"唐","c":"折戟沉沙铁未销，\n自将磨洗认前朝。\n东风不与周郎便，\n铜雀春深锁二乔。","a":[["0","1597379470245"],["1","1596530498237"],["2","1596877972029"],["3","1597384413719"],["0","1585669993761"],["1","1596611566523"],["2","1596611567825"],["3","1597315517455"]],"v":["1597936643889029717"]},{"p":"采桑子","au":"欧阳修","dy":"宋","c":"群芳过后西湖好，\n狼籍残红，飞絮濛濛，\n垂柳阑干尽日风。\n笙歌散尽游人去，\n始觉春空。放下帘栊，\n双燕归来细雨中。","a":[["0","1591175600027"],["1","1596529272647"],["3","1597392561404"],["4","1597541039118"]]},{"p":"野望","au":"王绩","dy":"唐","c":"东皋薄暮望，徙倚欲何依。\n树树皆秋色，山山唯落晖。\n牧人驱犊返，猎马带禽归。\n相顾无相识，长歌怀采薇。","a":[["0","1591172477445"],["1","1596595151504"],["2","1596595193002"],["3","1597419685111"],["4","1597311126448"]],"v":["1597278330976017181"]},{"p":"钱塘湖春行","au":"白居易","dy":"唐","c":"孤山寺北贾亭西，\n水面初平云脚低。\n几处早莺争暖树，\n谁家新燕啄春泥。\n乱花渐欲迷人眼，\n浅草才能没马蹄。\n最爱湖东行不足，\n绿杨阴里白沙堤。","a":[["0","1591174984312"],["1","1596532932796"],["2","1596532948160"],["3","1597419913818"],["4","1596859189086"]]},{"p":"雁门太守行","au":"李贺","dy":"唐","c":"黑云压城城欲摧，\n甲光向日金鳞开。\n角声满天秋色里，\n塞上燕脂凝夜紫。\n半卷红旗临易水，\n霜重鼓寒声不起。\n报君黄金台上意，\n提携玉龙为君死。","a":[["0","1591175419056"],["1","1596530622553"],["2","1596530642562"],["3","1597420823935"]],"v":["1597938382547079923"]},{"p":"饮酒（其五）","au":"陶渊明","dy":"晋","c":"结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。","a":[["0","1591175353866"],["1","1596531223365"],["2","1596531265234"],["3","1597420669870"],["4","1596859070648"]],"v":["1597278445129086826"]},{"p":"黄鹤楼","au":"崔颢","dy":"唐","c":"昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。","a":[["0","1591174795790"],["1","1596594012596"],["2","1596594547796"],["3","1597419745201"],["5","1596883035469"],["4","1596856342285"]],"v":["1597278049142041541"]},{"p":"陋室铭","au":"刘禹锡","dy":"唐","c":"山不在高，有仙则名。水不在深，有龙则灵。\n斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。\n谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。\n无丝竹之乱耳，无案牍之劳形。\n南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？","a":[["0","1584264467086"],["1","1596509304078"],["2","1596509322165"],["5","1596509332001"]]},{"p":"马说","au":"韩愈","dy":"唐","c":"世有伯乐，然后有千里马。千里马常有，而伯乐不常有。\n故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。\n马之千里者，一食或尽粟一石。食马者不知其能千里而食也。\n是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？\n策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：\"天下无马！\"呜呼！其真无马邪？其真不知马也！","a":[["0","1597543795391"],["1","1596520928843"],["2","1596520981903"],["5","1596521000012"]]},{"p":"曹刿论战","au":"左丘明","dy":"先秦《左传》","c":"十年春，齐师伐我。公将战，曹刿请见。\n其乡人曰：\"肉食者谋之，又何间焉？\"刿曰：\"肉食者鄙，未能远谋。\"乃入见。\n问：\"何以战？\"公曰：\"衣食所安，弗敢专也，必以分人。\"对曰：\"小惠未遍，民弗从也。\"\n公曰：\"牺牲玉帛，弗敢加也，必以信。\"对曰：\"小信未孚，神弗福也。\"\n公曰：\"小大之狱，虽不能察，必以情。\"对曰：\"忠之属也。可以一战。战则请从。\"\n公与之乘，战于长勺。公将鼓之。刿曰：\"未可。\"齐人三鼓。刿曰：\"可矣。\"齐师败绩。\n公将驰之。刿曰：\"未可。\"下视其辙，登轼而望之，曰：\"可矣。\"遂逐齐师。\n既克，公问其故。对曰：\"夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。\"","a":[["0","1597396046426"],["1","1596607437963"],["2","1596607443028"],["3","1591582021903"]]},{"p":"邹忌讽齐王纳谏","au":"刘向","dy":"汉《战国策》","c":"邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：\"我孰与城北徐公美？\"其妻曰：\"君美甚，徐公何能及君也？\"\n城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：\"吾孰与徐公美？\"妾曰：\"徐公何能及君也？\"\n旦日，客从外来，与坐谈，问之客曰：\"吾与徐公孰美？\"客曰：\"徐公不若君之美也。\"\n明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。\n暮寝而思之，曰：\"吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。\"\n于是入朝见威王，曰：\"臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。\n今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。\"\n王曰：\"善。\"乃下令：\"群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。\"\n令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲人，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。","a":[["0","1597648919593"],["1","1596607559339"],["2","1596607576561"],["3","1597410011878"]]},{"p":"鱼我所欲也","au":"孟子","dy":"先秦","c":"鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。\n生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。\n生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。\n如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？\n由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。\n非独贤者有是心也，人皆有之，贤者能勿丧耳。\n一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。\n万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？\n乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。","a":[["0","1597414281604"],["1","1596623240485"],["2","1596877617919"],["3","1596623232793"]]},{"p":"虽有嘉肴","au":"戴圣","dy":"汉《礼记》","c":"虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。\n是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。\n《兑命》曰\"学学半\"，其此之谓乎！","a":[["0","1591584386057"],["1","1596521540983"],["2","1596521567986"],["3","1597422269214"]]},{"p":"北冥有鱼","au":"庄子","dy":"先秦","c":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。\n鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。\n是鸟也，海运则将徙于南冥。南冥者，天池也。\n《齐谐》者，志怪者也。《谐》之言曰：\"鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。\"\n野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。","a":[["0","1586743775415"],["1","1596608758579"],["2","1596608763827"],["3","1597455573732"],["0","1584361374926"],["1","1596522042285"],["2","1596522064521"],["5","1596522080847"]],"v":["1597290389258036315"]},{"p":"送东阳马生序","au":"宋濂","dy":"明","c":"余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。\n天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。\n既加冠，益慕圣贤之道 ，又患无硕师、名人与游，尝趋百里外，从乡之先达执经叩问。\n先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。\n当余之从师也，负箧曳屣，行深山巨谷中，穷冬烈风，大雪深数尺，足肤皲裂而不知。\n至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。\n寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意。以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。","a":[["0","1597410086439"],["2","1596623022971"],["5","1597410114918"]]},{"p":"浣溪沙·一曲新词酒一杯","au":"晏殊","dy":"宋","c":"一曲新词酒一杯，去年天气旧亭台。\n夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。\n小园香径独徘徊。","a":[["0","1586403283798"],["1","1596612019769"],["2","1596612052444"],["3","1597414355432"],["0","1584727448631"],["1","1596525799358"],["2","1596525806587"],["3","1597396224833"]]},{"p":"无题·相见时难别亦难","au":"李商隐","dy":"唐","c":"相见时难别亦难，东风无力百花残。\n春蚕到死丝方尽，蜡炬成灰泪始干。\n晓镜但愁云鬓改，夜吟应觉月光寒。\n蓬山此去无多路，青鸟殷勤为探看。","a":[["0","1596623644834"],["1","1596623643272"],["2","1596623645254"],["3","1596623640554"],["5","1596623631345"],["4","1596859664389"]]},{"p":"过故人庄","au":"孟浩然","dy":"唐","c":"故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。","a":[["0","1589770502471"],["1","1596533121851"],["2","1596533127240"],["3","1597393918773"],["4","1596854347592"]]},{"p":"题破山寺后禅院","au":"常建","dy":"唐","c":"清晨入古寺，初日照高林。\n曲径通幽处，禅房花木深。\n山光悦鸟性，潭影空人心。\n万籁此都寂，但余钟磬音。","a":[["0","1597544458190"],["1","1596519702710"],["2","1596519725811"],["3","1597395276355"]]},{"p":"周亚夫军细柳","au":"司马迁","dy":"汉","c":"文帝之后六年，匈奴大入边。\n乃以宗正刘礼为将军，军霸上；\n祝兹侯徐厉为将军，军棘门；\n以河内守亚夫为将军，军细柳，以备胡。\n上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。\n已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。\n天子先驱至，不得入。\n先驱曰：\"天子且至！\"\n军门都尉曰：\"将军令曰：'军中闻将军令，不闻天子之诏。'\"\n居无何，上至，又不得入。\n于是上乃使使持节诏将军：\"吾欲入劳军。\"\n亚夫乃传言开壁门。\n壁门士吏谓从属车骑曰：\"将军曰，军中不得驱驰。\"\n于是天子乃按辔徐行。\n至营，将军亚夫持兵揖曰：\"介胄之士不拜，请以军礼见。\"\n天子为动，改容式车。\n使人称谢：\"皇帝敬劳将军。\"\n成礼而去。\n既出军门，群臣皆惊。\n文帝曰：\"嗟乎，此真将军矣！\n曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。\n至于亚夫，可得而犯邪！\"\n称善者久之。","a":[["0","1591175317842"],["1","1596531357061"],["2","1596531413513"],["3","1597420621397"]]},{"p":"如梦令·常记溪亭日暮","au":"李清照","dy":"宋","c":"常记溪亭日暮，\n沉醉不知归路。\n兴尽晚回舟，\n误入藕花深处。\n争渡，争渡，\n惊起一滩鸥鹭。","a":[["0","1591175707452"],["1","1596528680894"],["2","1596877778146"],["3","1597392175575"],["5","1597392198105"]]},{"p":"子衿","au":"诗经","dy":"先秦","c":"青青子衿，悠悠我心。\n纵我不往，子宁不嗣音？\n青青子佩，悠悠我思。\n纵我不往，子宁不来？\n挑兮达兮，在城阙兮。\n一日不见，如三月兮。","a":[["0","1591584011752"],["1","1596525950658"],["2","1596880919819"]]},{"p":"小石潭记","au":"柳宗元","dy":"唐","c":"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。\n伐竹取道，下见小潭，水尤清冽。\n全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。\n青树翠蔓，蒙络摇缀，参差披拂。\n潭中鱼可百许头，皆若空游无所依。\n日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽，似与游者相乐。\n潭西南而望，斗折蛇行，明灭可见。\n其岸势犬牙差互，不可知其源。\n坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。\n以其境过清，不可久居，乃记之而去。","a":[["0","1591601056990"],["1","1596528299116"],["2","1596528324277"],["5","1596528397929"]]},{"p":"庄子与惠子游于濠梁之上","au":"庄子","dy":"先秦","c":"庄子与惠子游于濠梁之上。\n庄子曰：\"鯈鱼出游从容，是鱼之乐也。\"\n惠子曰：\"子非鱼，安知鱼之乐？\"\n庄子曰：\"子非我，安知我不知鱼之乐？\"\n惠子曰：\"我非子，固不知子矣；子固非鱼也，子之不知鱼之乐全矣！\"\n庄子曰：\"请循其本。子曰'汝安知鱼乐'云者，既已知吾知之而问我，我知之濠上也。\"","a":[["0","1591582544542"],["1","1596521789477"],["2","1596521827846"],["5","1596521848935"]]},{"p":"庭中有奇树","au":"佚名","dy":"汉","c":"庭中有奇树，\n绿叶发华滋。\n攀条折其荣，\n将以遗所思。\n馨香盈怀袖，\n路远莫致之。\n此物何足贵？\n但感别经时。","a":[["0","1591175021540"],["1","1596532790309"],["2","1596532821560"],["3","1597422401941"],["4","1596856797535"]]},{"p":"曾子烹彘","au":"韩非子","dy":"先秦","c":"曾子之妻之市，其子随之而泣。\n其母曰：\"女还，顾反为女杀彘。\"\n妻适市来，曾子欲捕彘杀之。\n妻止之曰：\"特与婴儿戏耳。\"\n曾子曰：\"婴儿非与戏也。\n婴儿非有知也，待父母而学者也，听父母之教。\n今子欺之，是教子欺也。\n母欺子，子而不信其母，非所以成教也。\"\n遂烹彘也。","a":[["0","1591172328281"],["1","1596596296943"],["2","1596596349161"]]},{"p":"月夜","au":"刘方平","dy":"唐","c":"更深月色半人家，\n北斗阑干南斗斜。\n今夜偏知春气暖，\n虫声新透绿窗纱。","a":[["0","1585664853274"],["1","1596617169062"],["2","1596617160519"],["3","1597312271346"],["5","1596617153592"],["0","1591175516596"],["1","1596530025863"],["2","1603108957478"],["3","1597392288027"],["4","1597541109968"]]},{"p":"桃花源记并诗（下）","au":"陶渊明","dy":"晋","c":"嬴氏乱天纪，贤者避其世。\n黄绮之商山，伊人亦云逝。\n往迹浸复湮，来径遂芜废。\n相命肆农耕，日入从所憩。\n桑竹垂余荫，菽稷随时艺。\n春蚕收长丝，秋熟靡王税。\n荒路暧交通，鸡犬互鸣吠。\n俎豆犹古法，衣裳无新制。\n童孺纵行歌，斑白欢游诣。\n草荣识节和，木衰知风厉。\n虽无纪历志，四时自成岁。\n怡然有余乐，于何劳智慧？\n奇踪隐五百，一朝敞神界。\n淳薄既异源，旋复还幽蔽。\n借问游方士，焉测尘嚣外。\n愿言蹑清风，高举寻吾契。","a":[["0","1597216894093"],["1","1597216880544"],["2","1597210235554"],["0","1597217013413"],["1","1597217019178"],["2","1597541973637"],["3","1597420988778"]]},{"p":"梁甫行","au":"曹植","dy":"魏","c":"八方各异气，\n千里殊风雨。\n剧哉边海民，\n寄身于草野。\n妻子象禽兽，\n行止依林阻。\n柴门何萧条，\n狐兔翔我宇。","a":[["0","1591175122787"],["1","1596532310191"],["2","1596532378092"],["3","1597420145234"]]},{"p":"相见欢","au":"李煜","dy":"五代","c":"无言独上西楼，\n月如钩。\n寂寞梧桐深院锁清秋。\n剪不断，理还乱，\n是离愁，\n别是一般滋味在心头。","a":[["0","1591175672764"],["1","1596528902543"],["2","1596529105939"],["3","1591175673262"],["5","1596529140770"]]},{"p":"蒹葭","au":"诗经","dy":"先秦","c":"蒹葭苍苍，白露为霜。\n所谓伊人，在水一方。\n溯洄从之，道阻且长。\n溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。\n所谓伊人，在水之湄。\n溯洄从之，道阻且跻。\n溯游从之，宛在水中坻。\n蒹葭采采，白露未已。\n所谓伊人，在水之涘。\n溯洄从之，道阻且右。\n溯游从之，宛在水中沚。","a":[["0","1584361592162"],["1","1597391590620"],["2","1597391631999"],["3","1597391556415"],["5","1597391649842"]]},{"p":"送杜少府之任蜀州","au":"王勃","dy":"唐","c":"城阙辅三秦，\n风烟望五津。\n与君离别意，\n同是宦游人。\n海内存知己，\n天涯若比邻。\n无为在歧路，\n儿女共沾巾。","a":[["0","1584363210846"],["1","1596523336986"],["2","1596525777061"],["3","1597398463139"],["5","1597398476380"]]},{"p":"题白杨图","au":"白居易","dy":"唐","c":"《小雅》曰：\"昔我往矣，杨柳依依。\"\n此诗乃军中乐也。\n《采薇》诗曰：\"昔我往矣，杨柳依依；今我来思，雨雪霏霏。\"\n吾友有白杨，翛然于庭。\n吾作此诗以赠之。","a":[["0","1597415054178"],["1","1597414875004"],["2","1597414893509"]]},{"p":"龟虽寿","au":"曹操","dy":"汉","c":"神龟虽寿，犹有竟时；\n腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里；\n烈士暮年，壮心不已。\n盈缩之期，不但在天；\n养怡之福，可得永年。\n幸甚至哉，歌以咏志。","a":[["0","1591175055846"],["1","1596532683573"],["2","1596532690751"],["3","1597420020273"],["4","1596857909464"]]}],"九年级":[{"p":"丑奴儿·书博山道中壁","au":"辛弃疾","dy":"宋","c":"少年不识愁滋味，爱上层楼。\n爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。\n欲说还休，却道天凉好个秋。","a":[["0","1596623399215"],["1","1596623392359"],["2","1596623396737"],["3","1596623393981"],["4","1596860677077"]]},{"p":"出师表","au":"诸葛亮","dy":"三国","c":"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。","a":[["0","1591582275516"],["1","1596607272240"],["2","1596607282053"],["5","1596607292341"]]},{"p":"咸阳城东楼","au":"许浑","dy":"唐","c":"一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。","a":[["0","1596624135682"],["1","1596624133939"],["2","1596624128844"],["3","1596624131782"],["4","1596859534857"]]},{"p":"唐雎不辱使命-战国策","au":"刘向","dy":"汉","c":"秦王使人谓安陵君曰：\"寡人欲以五百里之地易安陵，安陵君其许寡人！\"安陵君曰：\"大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！\"秦王不说。安陵君因使唐雎使于秦。","a":[["0","1596623072715"],["1","1596623147943"],["2","1596623142209"],["3","1596623143386"]]},{"p":"定风波","au":"苏轼","dy":"宋","c":"莫听穿林打叶声，何妨吟啸且徐行。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。\n回首向来萧瑟处，归去，也无风雨也无晴。","a":[["0","1596620056000"],["1","1596884029418"],["2","1596620136462"],["3","1596620135238"],["5","1596884836501"]]},{"p":"山坡羊·潼关怀古","au":"张养浩","dy":"元","c":"峰峦如聚，波涛如怒，\n山河表里潼关路。\n望西都，意踌躇。\n伤心秦汉经行处，\n宫阙万间都做了土。\n兴，百姓苦；\n亡，百姓苦。","a":[["0","1597416828936"],["1","1596606262809"],["2","1596606314070"],["3","1597415938568"]]},{"p":"山坡羊·骊山怀古","au":"张养浩","dy":"元","c":"骊山四顾，阿房一炬，\n当时奢侈今何处？\n只见草萧疏，水萦纡。\n至今遗恨迷烟树。\n列国周齐秦汉楚，\n赢，都变做了土；\n输，都变做了土。","a":[["0","1597418638562"],["1","1597418668994"],["2","1596599066269"],["3","1597418682940"]]},{"p":"岳阳楼记","au":"范仲淹","dy":"宋","c":"庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也。前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？","a":[["0","1596638304728"],["1","1596638302765"],["2","1596638298283"],["5","1596638290440"],["4","1596860713243"]],"v":["1597241982925056433"]},{"p":"水调歌头","au":"苏轼","dy":"宋","c":"明月几时有？把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\n起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，此事古难全。\n但愿人长久，千里共婵娟。","a":[["0","1596637499556"],["1","1596637487283"],["2","1603678936040"],["3","1596637481629"],["5","1596637488026"],["4","1596859345382"]],"v":["1597221932231021435"]},{"p":"江城子·密州出猎","au":"苏轼","dy":"宋","c":"老夫聊发少年狂，左牵黄，右擎苍，\n锦帽貂裘，千骑卷平冈。\n为报倾城随太守，亲射虎，看孙郎。\n酒酣胸胆尚开张，鬓微霜，又何妨！\n持节云中，何日遣冯唐？\n会挽雕弓如满月，西北望，射天狼。","a":[["0","1596622643092"],["1","1596622639185"],["2","1597417485233"],["3","1596622643979"]]},{"p":"沁园春·雪","au":"毛泽东","dy":"近现代","c":"北国风光，千里冰封，万里雪飘。\n望长城内外，惟余莽莽；大河上下，顿失滔滔。\n山舞银蛇，原驰蜡象，欲与天公试比高。\n须晴日，看红装素裹，分外妖娆。\n江山如此多娇，引无数英雄竞折腰。\n惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。\n一代天骄，成吉思汗，只识弯弓射大雕。\n俱往矣，数风流人物，还看今朝。","a":[["0","1605236809700"],["1","1605236819616"]],"v":["1597241904558086341"]},{"p":"浣溪沙","au":"晏殊","dy":"宋","c":"一曲新词酒一杯，\n去年天气旧亭台。\n夕阳西下几时回？\n无可奈何花落去，\n似曾相识燕归来。\n小园香径独徘徊。","a":[["0","1586403283798"],["1","1596612019769"],["2","1596612052444"],["3","1597414355432"],["0","1584727448631"],["1","1596525799358"],["2","1596525806587"],["3","1597396224833"]]},{"p":"湖心亭看雪","au":"张岱","dy":"明","c":"崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余，大喜曰：\"湖中焉得更有此人！\"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：\"莫说相公痴，更有痴似相公者！","a":[["0","1596638009131"],["1","1596638022900"],["2","1596638004346"],["3","1596638003370"]],"v":["1597204499952023626"]},{"p":"白雪歌送武判官归京","au":"岑参","dy":"唐","c":"北风卷地白草折，胡天八月即飞雪。\n忽如一夜春风来，千树万树梨花开。\n散入珠帘湿罗幕，狐裘不暖锦衾薄。\n将军角弓不得控，都护铁衣冷难着。\n瀚海阑干百丈冰，愁云惨淡万里凝。\n中军置酒饮归客，胡琴琵琶与羌笛。\n纷纷暮雪下辕门，风掣红旗冻不翻。\n轮台东门送君去，去时雪满天山路。\n山回路转不见君，雪上空留马行处。","a":[["0","1596606679888"],["1","1596606692862"],["2","1596606728795"],["3","1596606719217"]]},{"p":"祖逖闻鸡起舞","au":"房玄龄","dy":"唐","c":"初，范阳祖逖，少有大志，与刘琨俱为司州主簿，同寝，中夜闻鸡鸣，蹴琨觉曰：\"此非恶声也！\"因起舞。","a":[["0","1596638582009"],["1","1596638584484"],["2","1596638587646"],["3","1596638585913"]]},{"p":"行路难（其一）","au":"李白","dy":"唐","c":"金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。","a":[["0","1596637888018"],["1","1596637891344"],["2","1596637880496"],["3","1596637893778"],["4","1596859449427"]],"v":["1597222386186042659"]},{"p":"酬乐天扬州初逢席上见赠","au":"刘禹锡","dy":"唐","c":"巴山楚水凄凉地，二十三年弃置身。\n怀旧空吟闻笛赋，到乡翻似烂柯人。\n沉舟侧畔千帆过，病树前头万木春。\n今日听君歌一曲，暂凭杯酒长精神。","a":[["0","1591261723184"],["1","1596637594012"],["2","1596637616360"],["3","1597417850183"],["4","1596860747154"]],"v":["1597210490938030099"]},{"p":"醉翁亭记","au":"欧阳修","dy":"宋","c":"环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。","a":[["0","1596638173964"],["1","1596638178437"],["2","1596638169941"],["5","1596638184785"],["4","1596859606121"]],"v":["1597222163657095504"]},{"p":"长沙过贾谊宅","au":"刘长卿","dy":"唐","c":"三年谪宦此栖迟，万古惟留楚客悲。\n秋草独寻人去后，寒林空见日斜时。\n汉文有道恩犹薄，湘水无情吊岂知？\n寂寂江山摇落处，怜君何事到天涯！","a":[["0","1596624413855"],["1","1596624417244"],["2","1596624423343"],["3","1596624420277"],["4","1596859574838"]]},{"p":"渔家傲·秋思","au":"范仲淹","dy":"宋","c":"塞下秋来风景异，衡阳雁去无留意。\n四面边声连角起，千嶂里，长烟落日孤城闭。\n浊酒一杯家万里，燕然未勒归无计。\n羌管悠悠霜满地，人不寐，将军白发征夫泪。","a":[["0","1591175486978"],["1","1596530315352"],["2","1596530363089"],["4","1597539644486"],["0","1596622923347"],["1","1596622925665"],["2","1596622878865"],["3","1596622920772"],["5","1596622868830"]]},{"p":"望江南·梳洗罢","au":"温庭筠","dy":"唐","c":"梳洗罢，独倚望江楼。\n过尽千帆皆不是，斜晖脉脉水悠悠。肠断白苹洲。","a":[["0","1589335624079"],["1","1596508048541"],["2","1596508038958"],["3","1597375275468"],["5","1596508176232"],["4","1596762555738"]]},{"p":"武陵春·风住尘香花已尽","au":"李清照","dy":"宋","c":"风住尘香花已尽，日晚倦梳头。\n物是人非事事休，欲语泪先流。\n闻说双溪春尚好，也拟泛轻舟。\n只恐双溪舴艋舟，载不动许多愁。","a":[["0","1589338981437"],["1","1596506933376"],["2","1596506927588"],["3","1597375077013"],["5","1597311327180"],["4","1596762607268"]]},{"p":"醉花阴·薄雾浓云愁永昼","au":"李清照","dy":"宋","c":"薄雾浓云愁永昼，瑞脑消金兽。\n佳节又重阳，玉枕纱厨，半夜凉初透。\n东篱把酒黄昏后，有暗香盈袖。\n莫道不销魂，帘卷西风，人比黄花瘦。"},{"p":"朝天子·咏喇叭","au":"王磐","dy":"明","c":"喇叭，唢呐，曲儿小腔儿大。\n官船来往乱如麻，全仗你抬声价。\n军听了军愁，民听了民怕。哪里去辨甚么真共假？\n眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！","a":[["0","1584364636103"],["1","1596598837015"],["2","1596598889637"]]},{"p":"满江红·怒发冲冠","au":"岳飞","dy":"宋","c":"怒发冲冠，凭栏处、潇潇雨歇。\n抬望眼，仰天长啸，壮怀激烈。\n三十功名尘与土，八千里路云和月。\n莫等闲、白了少年头，空悲切。\n靖康耻，犹未雪。臣子恨，何时灭！\n驾长车，踏破贺兰山缺。\n壮志饥餐胡虏肉，笑谈渴饮匈奴血。\n待从头、收拾旧山河，朝天阙。","a":[["0","1596620291171"],["1","1596620351722"],["2","1596620338212"],["3","1596620352112"]]},{"p":"河中石兽","au":"纪昀","dy":"清","c":"沧州南一寺临河干，山门圮于河，二石兽并沉焉。阅十余岁，僧募金重修，求二石兽于水中，竟不可得，以为顺流下矣。\n棹数小舟，曳铁钯，寻十余里无迹。一讲学家设帐寺中，闻之笑曰：\"尔辈不能究物理。是非木杮，岂能为暴涨携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？\"众服为确论。\n一老河兵闻之，又笑曰：\"凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴，渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？\"如其言，果得于数里外。然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？","a":[["0","1597302193325"],["1","1596508340517"],["2","1596508409893"],["3","1597984415080"]]},{"p":"月夜忆舍弟","au":"杜甫","dy":"唐","c":"戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。","a":[["0","1596636567575"],["1","1596636571015"],["2","1596636578700"],["3","1596636573465"],["5","1596627821214"],["4","1596860772075"]]},{"p":"左迁至蓝关示侄孙湘","au":"韩愈","dy":"唐","c":"一封朝奏九重天，夕贬潮州路八千。\n欲为圣明除弊事，肯将衰朽惜残年！\n云横秦岭家何在？雪拥蓝关马不前。\n知汝远来应有意，好收吾骨瘴江边。","a":[["0","1596624361800"],["1","1596624359857"],["2","1596624356848"],["3","1596624363906"],["4","1596860642608"]]},{"p":"临江仙·夜登小阁，忆洛中旧游","au":"陈与义","dy":"宋","c":"忆昔午桥桥上饮，\n坐中多是豪英。\n长沟流月去无声。\n杏花疏影里，\n吹笛到天明。\n二十余年如一梦，\n此身虽在堪惊。\n闲登小阁看新晴。\n古今多少事，\n渔唱起三更。","a":[["0","1596619856075"],["1","1596619853568"],["2","1596619827792"],["3","1597395501352"]]},{"p":"别云间","au":"夏完淳","dy":"明","c":"三年羁旅客，\n今日又南冠。\n无限河山泪，\n谁言天地宽！\n已知泉路近，\n欲别故乡难。\n毅魄归来日，\n灵旗空际看。","a":[["0","1584364347864"],["1","1596599294990"],["2","1596599492957"],["3","1597415433953"]]},{"p":"十五从军征【乐府诗集】","au":"佚名","dy":"汉","c":"十五从军征，八十始得归。\n道逢乡里人：\"家中有阿谁？\"\n\"遥看是君家，松柏冢累累。\"\n兔从狗窦入，雉从梁上飞。\n中庭生旅谷，井上生旅葵。\n舂谷持作饭，采葵持作羹。\n羹饭一时熟，不知贻阿谁。\n出门东向看，泪落沾我衣。","a":[["0","1584364447405"],["1","1596606939590"],["2","1596606958377"],["3","1597414491450"]]},{"p":"南乡子·登京口北固亭有怀","au":"辛弃疾","dy":"宋","c":"何处望神州？\n满眼风光北固楼。\n千古兴亡多少事？悠悠。\n不尽长江滚滚流。\n年少万兜鍪，坐断东南战未休。\n天下英雄谁敌手？曹刘。\n生子当如孙仲谋。","a":[["0","1584364685168"],["1","1596606557458"],["2","1596606604064"],["3","1597414819170"]]},{"p":"南安军","au":"文天祥","dy":"宋","c":"梅花南北路，\n风雨湿征衣。\n出岭同谁出？\n归乡如不归！\n山河千古在，\n城郭一时非。\n饿死真吾志，\n梦中采薇。","a":[["0","1584947738721"],["1","1596605036582"],["2","1596605092282"],["3","1597415365828"]]},{"p":"商山早行","au":"温庭筠","dy":"唐","c":"晨起动征铎，\n客行悲故乡。\n鸡声茅店月，\n人迹板桥霜。\n槲叶落山路，\n枳花明驿墙。\n因思杜陵梦，\n凫雁满回塘。","a":[["0","1596624240798"],["1","1596624238970"],["2","1596624233679"],["3","1596624236594"],["4","1596859411182"]]},{"p":"太常引·建康中秋夜为吕叔潜赋","au":"辛弃疾","dy":"宋","c":"一轮秋影转金波，\n飞镜又重磨。\n把酒问姮娥：\n被白发、欺人奈何？\n乘风好去，\n长空万里，\n直下看山河。\n斫去桂婆娑，\n人道是、清光更多。","a":[["0","1583247538666"],["1","1596618863404"],["2","1596618824166"],["3","1597414653328"]]},{"p":"无题","au":"李商隐","dy":"唐","c":"相见时难别亦难，\n东风无力百花残。\n春蚕到死丝方尽，\n蜡炬成灰泪始干。\n晓镜但愁云鬓改，\n夜吟应觉月光寒。\n蓬山此去无多路，\n青鸟殷勤为探看。","a":[["0","1596623644834"],["1","1596623643272"],["2","1596623645254"],["3","1596623640554"],["5","1596623631345"],["4","1596859664389"]]},{"p":"曹刿论战","au":"左丘明","dy":"先秦","c":"十年春，齐师伐我。公将战，曹刿请见。\n其乡人曰：\"肉食者谋之，又何间焉？\"\n刿曰：\"肉食者鄙，未能远谋。\"\n乃入见。问：\"何以战？\"\n公曰：\"衣食所安，弗敢专也，必以分人。\"\n对曰：\"小惠未遍，民弗从也。\"\n公曰：\"牺牲玉帛，弗敢加也，必以信。\"\n对曰：\"小信未孚，神弗福也。\"\n公曰：\"小大之狱，虽不能察，必以情。\"\n对曰：\"忠之属也。可以一战。战则请从。\"\n公与之乘，战于长勺。\n公将鼓之。刿曰：\"未可。\"\n齐人三鼓。刿曰：\"可矣。\"\n齐师败绩。公将驰之。刿曰：\"未可。\"\n下视其辙，登轼而望之，曰：\"可矣。\"\n遂逐齐师。\n既克，公问其故。\n对曰：\"夫战，勇气也。\n一鼓作气，再而衰，三而竭。\n彼竭我盈，故克之。\n夫大国，难测也，惧有伏焉。\n吾视其辙乱，望其旗靡，故逐之。\"","a":[["0","1597396046426"],["1","1596607437963"],["2","1596607443028"],["3","1591582021903"]]},{"p":"梅岭三章","au":"陈毅","dy":"近代","c":"断头今日意如何？\n创业艰难百战多。\n此去泉台招旧部，\n旌旗十万斩阎罗。\n南国烽烟正十年，\n此头须向国门悬。\n后死诸君多努力，\n捷报飞来当纸钱。\n投身革命即为家，\n血雨腥风应有涯。\n取义成仁今日事，\n人间遍种自由花。","a":[["0","1597233658961"],["1","1597233665667"],["2","1597233667102"],["3","1597233661979"]]},{"p":"满江红","au":"岳飞","dy":"宋","c":"怒发冲冠，凭栏处、潇潇雨歇。\n抬望眼，仰天长啸，壮怀激烈。\n三十功名尘与土，八千里路云和月。\n莫等闲，白了少年头，空悲切。\n靖康耻，犹未雪；臣子恨，何时灭！\n驾长车，踏破贺兰山缺。\n壮志饥餐胡虏肉，笑谈渴饮匈奴血。\n待从头、收拾旧山河，朝天阙。","a":[["0","1596620291171"],["1","1596620351722"],["2","1596620338212"],["3","1596620352112"]]},{"p":"破阵子·为陈同甫赋壮词以寄之","au":"辛弃疾","dy":"宋","c":"醉里挑灯看剑，\n梦回吹角连营。\n八百里分麾下炙，\n五十弦翻塞外声，\n沙场秋点兵。\n马作的卢飞快，\n弓如霹雳弦惊。\n了却君天下事，\n赢得生前身后名。\n可怜白发生！","a":[["0","1596620632530"],["1","1596620659584"],["2","1596620667033"],["3","1596620660613"]]},{"p":"范仲淹断齑画粥","au":"范仲淹","dy":"宋","c":"范仲淹少贫，读书长白山僧舍，\n作粥一器，经宿遂凝，\n以刀画为四块，早晚取其二，\n断齑数十茎啖之。\n留守闻其贤，延之西府，\n馈以饭馔。仲淹食之，\n归则复以齑粥啖之。","a":[["0","1596638429651"],["1","1596638430225"],["2","1596638428076"],["3","1596638431169"]]},{"p":"行香子","au":"秦观","dy":"宋","c":"树绕村庄，水满陂塘。\n倚东风、豪兴徜徉。\n小园几许，收尽春光。\n有桃花红，李花白，菜花黄。\n远远围墙，隐隐茅堂。\n飏青旗、流水桥旁。\n偶然乘兴、步过东冈。\n正莺儿啼，燕儿舞，蝶儿忙。","a":[["0","1596623537056"],["1","1596623543294"],["2","1596623547983"],["3","1596623545079"],["4","1596860608015"]]},{"p":"过零丁洋","au":"文天祥","dy":"宋","c":"辛苦遭逢起一经，\n干戈寥落四周星。\n山河破碎风飘絮，\n身世浮沉雨打萍。\n惶恐滩头说惶恐，\n零丁洋里叹零丁。\n人生自古谁无死？\n留取丹心照汗青。","a":[["0","1584364558110"],["1","1596606457874"],["2","1596606480215"],["4","1596868095869"]]},{"p":"送东阳马生序","au":"宋濂","dy":"明","c":"余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。\n天大寒，砚冰坚，手指不可屈伸，弗之怠。\n录毕，走送之，不敢稍逾约。\n以是人多以书假余，余因得遍观群书。\n既加冠，益慕圣贤之道。\n又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。\n先达德隆望尊，门人弟子填其室，未尝稍降辞色。\n余立侍左右，援疑质理，俯身倾耳以请；\n或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；\n俟其欣悦，则又请焉。\n故余虽愚，卒获有所闻。\n当余之从师也，负箧曳屣，行深山巨谷中。\n穷冬烈风，大雪深数尺，足肤皲裂而不知。\n至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。\n寓逆旅，主人日再食，无鲜肥滋味之享。\n同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；\n余则缊袍敝衣处其间，略无慕艳意。\n以中有足乐者，不知口体之奉不若人也。\n盖余之勤且艰若此。","a":[["0","1597410086439"],["2","1596623022971"],["5","1597410114918"]]},{"p":"邹忌讽齐王纳谏","au":"刘向","dy":"汉","c":"邹忌修八尺有余，而形貌昳丽。\n朝服衣冠，窥镜，谓其妻曰：\"我孰与城北徐公美？\"\n其妻曰：\"君美甚，徐公何能及君也！\"\n城北徐公，齐国之美丽者也。\n忌不自信，而复问其妾曰：\"吾孰与徐公美？\"\n妾曰：\"徐公何能及君也！\"\n旦日，客从外来，与坐谈，问之客曰：\"吾与徐公孰美？\"\n客曰：\"徐公不若君之美也。\"\n明日徐公来，孰视之，自以为不如；\n窥镜而自视，又弗如远甚。\n暮寝而思之，曰：\"吾妻之美我者，私我也；\n妾之美我者，畏我也；客之美我者，欲有求于我也。\"\n于是入朝见威王，曰：\"臣诚知不如徐公美。\n臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。\n今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：\n由此观之，王之蔽甚矣。\"\n王曰：\"善。\"\n乃下令：\"群臣吏民能面刺寡人之过者，受上赏；\n上书谏寡人者，受中赏；\n能谤讥于市朝，闻寡人之耳者，受下赏。\"\n令初下，群臣进谏，门庭若市；\n数月之后，时时而间进；\n期年之后，虽欲言，无可进者。\n燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。","a":[["0","1597648919593"],["1","1596607559339"],["2","1596607576561"],["3","1597410011878"]]},{"p":"陈涉世家","au":"司马迁","dy":"汉","c":"陈胜者，阳城人也，字涉。\n吴广者，阳夏人也，字叔。\n陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：\"苟富贵，无相忘。\"\n佣者笑而应曰：\"若为佣耕，何富贵也？\"\n陈涉太息曰：\"嗟乎！燕雀安知鸿鹄之志哉！\"\n二世元年七月，发闾左適戍渔阳，九百人屯大泽乡。\n陈胜、吴广皆次当行，为屯长。\n会天大雨，道不通，度已失期。\n失期，法皆斩。\n陈胜、吴广乃谋曰：\"今亡亦死，举大计亦死；等死，死国可乎？\"\n陈胜曰：\"天下苦秦久矣。\n吾闻二世少子也，不当立，当立者乃公子扶苏。\n扶苏以数谏故，上使外将兵。\n今或闻无罪，二世杀之。\n百姓多闻其贤，未知其死也。\n项燕为楚将，数有功，爱士卒，楚人怜之。\n或以为死，或以为亡。\n今诚以吾众诈自称公子扶苏、项燕，为天下唱，宜多应者。\"\n吴广以为然。乃行卜。\n卜者知其指意，曰：\"足下事皆成，有功。然足下卜之鬼乎！\"\n陈胜、吴广喜，念鬼，曰：\"此教我先威众耳。\"\n乃丹书帛曰\"陈胜王\"，置人所罾鱼腹中。\n卒买鱼烹食，得鱼腹中书，固以怪之矣。\n又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：\"大楚兴，陈胜王。\"\n卒皆夜惊恐。旦日，卒中往往语，皆指目陈胜。","a":[["0","1596883177362"],["1","1596883160530"],["2","1596883164251"],["5","1596883168531"]]},{"p":"鱼我所欲也","au":"孟子","dy":"先秦","c":"鱼，我所欲也；熊掌，亦我所欲也。\n二者不可得兼，舍鱼而取熊掌者也。\n生，亦我所欲也；义，亦我所欲也。\n二者不可得兼，舍生而取义者也。\n生亦我所欲，所欲有甚于生者，故不为苟得也；\n死亦我所恶，所恶有甚于死者，故患有所不辟也。\n如使人之所欲莫甚于生，则凡可以得生者何不用也？\n使人之所恶莫甚于死者，则凡可以辟患者何不为也？\n由是则生而有不用也，由是则可以辟患而有不为也。\n是故所欲有甚于生者，所恶有甚于死者。\n非独贤者有是心也，人皆有之，贤者能勿丧耳。\n一箪食，一豆羹，得之则生，弗得则死。\n呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。\n万钟则不辩礼义而受之，万钟于我何加焉！\n为宫室之美，妻妾之奉，所识穷乏者得我与？\n乡为身死而不受，今为宫室之美为之；\n乡为身死而不受，今为妻妾之奉为之；\n乡为身死而不受，今为所识穷乏者得我而为之。\n是亦不可以已乎？此之谓失其本心。","a":[["0","1597414281604"],["1","1596623240485"],["2","1596877617919"],["3","1596623232793"]]}],"文言文选择性必修（10篇）":[{"p":"五代史伶官传序","au":"欧阳修","dy":"宋","c":"呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。","a":[["0","1586747403540"],["1","1596607157149"],["2","1596607161478"]]},{"p":"子路曾皙冉有公西华侍坐","au":"孔子及其弟子","dy":"先秦","c":"子路、曾皙、冉有、公西华侍坐。子曰：\"以吾一日长乎尔，毋吾以也。居则曰：'不吾知也！'如或知尔，则何以哉？","a":[["0","1592532618574"],["1","1596608103728"],["2","1596608112745"],["3","1597384403505"]],"v":["1597279026444075513"]},{"p":"归去来兮辞","au":"陶渊明","dy":"晋","c":"归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。","a":[["0","1585805029155"],["1","1596607819222"],["2","1596607866064"],["5","1596607807307"]],"v":["1597219796173061900"]},{"p":"报任安书","au":"司马迁","dy":"汉","c":"古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。","a":[["0","1586747437407"],["1","1596607985859"],["2","1596607980438"],["5","1596607975892"]]},{"p":"登泰山记","au":"姚鼐","dy":"清","c":"泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。","a":[["0","1597456570075"],["1","1597456574210"],["2","1596606426972"],["5","1596606441287"]],"v":["1597278879944085162"]},{"p":"过秦论","au":"贾谊","dy":"汉","c":"秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。","a":[["0","1585876998712"],["1","1597385147859"],["5","1597384991875"]],"v":["1597279752535063046"]},{"p":"陈情表","au":"李密","dy":"晋","c":"臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。","a":[["0","1585797468045"],["1","1596607922833"],["2","1596607935188"],["5","1596607937949"]]},{"p":"礼运（大道之行也）","au":"戴圣","dy":"汉《礼记》","c":"大道之行也，天下为公。选贤与能，讲信修睦。\n故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。\n货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。\n是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。\n今大道既隐，天下为家。各亲其亲，各子其子，货力为己。大人世及以为礼，城郭沟池以为固。礼义以为纪，以正君臣，以笃父子，以睦兄弟，以和夫妇，以设制度，以立田里，以贤勇知，以功为己。故谋用是作，而兵由此起。禹、汤、文、武、成王、周公，由此其选也。此六君子者，未有不谨于礼者也。以著其义，以考其信，著有过，刑仁讲让，示民有常。如有不由此者，在埶者去，众以为殃。是谓小康。","a":[["0","1591602269189"],["1","1597385707252"],["2","1597385781784"],["5","1597386071272"]]},{"p":"种树郭橐驼传","au":"柳宗元","dy":"唐","c":"郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之\"驼\"。驼闻之曰：\"甚善。名我固当。\"因舍其名，亦自谓\"橐驼\"云。\n其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活；且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。\n有问之，对曰：\"橐驼非能使木寿且孳也，以能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然，根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤。旦视而暮抚，已去而复顾。甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之；故不我若也。吾又何能为哉？\"\n问者曰：\"嘻，不亦善夫！吾问养树，得养人术。\"传其事以为官戒。","a":[["0","1586747468437"],["1","1596607313655"],["2","1596607318125"],["5","1596607286600"]]},{"p":"石钟山记","au":"苏轼","dy":"宋","c":"《水经》云：\"彭蠡之口有石钟山焉。\"郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？\n元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至莫夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声而惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵淡澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。\n因笑谓迈曰：\"汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！\"\n事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。","a":[["0","1597456853935"]]},{"p":"六国论","au":"苏洵","dy":"宋","c":"六国破灭，非兵不利，战不善，弊在赂秦。\n赂秦而力亏，破灭之道也。\n或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧，盖失强援，不能独完。\n故曰：弊在赂秦也。\n秦以攻取之外，小则获邑，大则得城。\n较秦之所得，与战胜而得者，其实百倍；\n诸侯之所亡，与战败而亡者，其实亦百倍。\n则秦之所大欲，诸侯之所大患，固不在战矣。\n思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。\n子孙视之不甚惜，举以予人，如弃草芥。\n今日割五城，明日割十城，然后得一夕安寝。\n起视四境，而秦兵又至矣。\n然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。\n故不战而强弱胜负已判矣。\n至于颠覆，理固宜然。\n古人云：\"以地事秦，犹抱薪救火，薪不尽，火不灭。\"此言得之。\n齐人未尝赂秦，终继五国迁灭，何哉？\n与嬴而不助五国也。\n五国既丧，齐亦不免矣。\n燕赵之君，始有远略，能守其土，义不赂秦。\n是故燕虽小国而后亡，斯用兵之效也。\n至丹以荆卿为计，始速祸焉。\n赵尝五战于秦，二败而三胜。\n后秦击赵者再，李牧连却之。\n洎牧以谗诛，邯郸为郡，惜其用武而不终也。\n且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。\n向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，\n则胜负之数，存亡之理，当与秦相较，或未易量。\n呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，\n并力西向，则吾恐秦人食之不得下咽也。\n悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。\n为国者无使为积威之所劫哉！\n夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。\n苟以天下之大，而从六国破亡之故事，是又在六国下矣。","a":[["0","1586499859686"],["1","1596605816566"],["2","1596605833035"],["5","1596605836514"]],"v":["1597278722959062411"]},{"p":"兰亭集序","au":"王羲之","dy":"晋","c":"永和九年，岁在癸丑，暮春之初，\n会于会稽山阴之兰亭，修禊事也。\n群贤毕至，少长咸集。\n此地有崇山峻岭，茂林修竹；\n又有清流激湍，映带左右，引以为流觞曲水，列坐其次。\n虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。\n是日也，天朗气清，惠风和畅。\n仰观宇宙之大，俯察品类之盛，\n所以游目骋怀，足以极视听之娱，信可乐也。\n夫人之相与，俯仰一世，\n或取诸怀抱，悟言一室之内；\n或因寄所托，放浪形骸之外。\n虽趣舍万殊，静躁不同，\n当其欣于所遇，暂得于己，快然自足，不知老之将至；\n及其所之既倦，情随事迁，感慨系之矣。\n向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，\n况修短随化，终期于尽！\n古人云：\"死生亦大矣。\"岂不痛哉！\n每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。\n固知一死生为虚诞，齐彭殇为妄作。\n后之视今，亦犹今之视昔，悲夫！\n故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。\n后之览者，亦将有感于斯文。","a":[["0","1585916493633"],["1","1596608517649"],["2","1596608513752"],["5","1596608514656"]],"v":["1597285917487088899"]},{"p":"师说","au":"韩愈","dy":"唐","c":"古之学者必有师。\n师者，所以传道受业解惑也。\n人非生而知之者，孰能无惑？\n惑而不从师，其为惑也，终不解矣。\n生乎吾前，其闻道也固先乎吾，吾从而师之；\n生乎吾后，其闻道也亦先乎吾，吾从而师之。\n吾师道也，夫庸知其年之先后生于吾乎？\n是故无贵无贱，无长无少，道之所存，师之所存也。\n嗟乎！师道之不传也久矣！欲人之无惑也难矣！\n古之圣人，其出人也远矣，犹且从师而问焉；\n今之众人，其下圣人也亦远矣，而耻学于师。\n是故圣益圣，愚益愚。\n圣人之所以为圣，愚人之所以为愚，其皆出于此乎？\n爱其子，择师而教之；\n于其身也，则耻师焉，惑矣。\n彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。\n句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。\n巫医乐师百工之人，不耻相师。\n士大夫之族，曰师曰弟子云者，则群聚而笑之。\n问之，则曰：\"彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。\"\n呜呼！师道之不复，可知矣。\n巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！\n圣人无常师。孔子师郯子、苌弘、师襄、老聃。\n郯子之徒，其贤不及孔子。\n孔子曰：\"三人行，则必有我师。\"\n是故弟子不必不如师，师不必贤于弟子。\n闻道有先后，术业有专攻，如是而已。\n李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。\n余嘉其能行古道，作《师说》以贻之。","a":[["0","1586500004555"],["1","1596606073673"],["2","1596606075822"],["5","1596606076631"]]},{"p":"滕王阁序","au":"王勃","dy":"唐","c":"豫章故郡，洪都新府。\n星分翼轸，地接衡庐。\n襟三江而带五湖，控蛮荆而引瓯越。\n物华天宝，龙光射牛斗之墟；\n人杰地灵，徐孺下陈蕃之榻。\n雄州雾列，俊采星驰。\n台隍枕夷夏之交，宾主尽东南之美。\n都督阎公之雅望，棨戟遥临；\n宇文新州之懿范，襜帷暂驻。\n十旬休假，胜友如云；\n千里逢迎，高朋满座。\n腾蛟起凤，孟学士之词宗；\n紫电青霜，王将军之武库。\n家君作宰，路出名区；\n童子何知，躬逢胜饯。\n时维九月，序属三秋。\n潦水尽而寒潭清，烟光凝而暮山紫。\n俨骖騑于上路，访风景于崇阿。\n临帝子之长洲，得仙人之旧馆。\n层峦耸翠，上出重霄；\n飞阁流丹，下临无地。\n鹤汀凫渚，穷岛屿之萦回；\n桂殿兰宫，列冈峦之体势。\n披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。\n闾阎扑地，钟鸣鼎食之家；\n舸舰弥津，青雀黄龙之舳。\n云销雨霁，彩彻区明。\n落霞与孤鹜齐飞，秋水共长天一色。\n渔舟唱晚，响穷彭蠡之滨；\n雁阵惊寒，声断衡阳之浦。\n遥襟甫畅，逸兴遄飞。\n爽籁发而清风生，纤歌凝而白云遏。\n睢园绿竹，气凌彭泽之樽；\n邺水朱华，光照临川之笔。\n四美具，二难并。\n穷睇眄于中天，极娱游于暇日。\n天高地迥，觉宇宙之无穷；\n兴尽悲来，识盈虚之有数。\n望长安于日下，目吴会于云间。\n地势极而南溟深，天柱高而北辰远。\n关山难越，谁悲失路之人？\n萍水相逢，尽是他乡之客。\n怀帝阍而不见，奉宣室以何年？\n嗟乎！时运不齐，命途多舛。\n冯唐易老，李广难封。\n屈贾谊于长沙，非无圣主；\n窜梁鸿于海曲，岂乏明时？\n所赖君子见机，达人知命。\n老当益壮，宁移白首之心？\n穷且益坚，不坠青云之志。\n酌贪泉而觉爽，处涸辙以犹欢。\n北海虽赊，扶摇可接；\n东隅已逝，桑榆非晚。\n孟尝高洁，空余报国之情；\n阮籍猖狂，岂效穷途之哭？\n勃，三尺微命，一介书生。\n无路请缨，等终军之弱冠；\n有怀投笔，慕宗悫之长风。\n舍簪笏于百龄，奉晨昏于万里。\n非谢家之宝树，接孟氏之芳邻。\n他日趋庭，叨陪鲤对；\n今兹捧袂，喜托龙门。\n杨意不逢，抚凌云而自惜；\n钟期既遇，奏流水以何惭？\n呜呼！胜地不常，盛筵难再；\n兰亭已矣，梓泽丘墟。\n临别赠言，幸承恩于伟饯；\n登高作赋，是所望于群公。\n敢竭鄙怀，恭疏短引；\n一言均赋，四韵俱成。\n请洒潘江，各倾陆海云尔。","a":[["0","1597411648864"],["1","1597411662896"],["2","1597418663088"],["3","1597455775850"]]},{"p":"阿房宫赋","au":"杜牧","dy":"唐","c":"六王毕，四海一，蜀山兀，阿房出。\n覆压三百余里，隔离天日。\n骊山北构而西折，直走咸阳。\n二川溶溶，流入宫墙。\n五步一楼，十步一阁；\n廊腰缦回，檐牙高啄；\n各抱地势，钩心斗角。\n盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。\n长桥卧波，未云何龙？\n复道行空，不霁何虹？\n高低冥迷，不知西东。\n歌台暖响，春光融融；\n舞殿冷袖，风雨凄凄。\n一日之内，一宫之间，而气候不齐。\n妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。\n朝歌夜弦，为秦宫人。\n明星荧荧，开妆镜也；\n绿云扰扰，梳晓鬟也；\n渭流涨腻，弃脂水也；\n烟斜雾横，焚椒兰也。\n雷霆乍惊，宫车过也；\n辘辘远听，杳不知其所之也。\n一肌一容，尽态极妍，缦立远视，而望幸焉。\n有不见者，三十六年。\n燕赵之收藏，韩魏之经营，齐楚之精英，\n几世几年，剽掠其人，倚叠如山。\n一旦不能有，输来其间。\n鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。\n嗟乎！一人之心，千万人之心也。\n秦爱纷奢，人亦念其家。\n奈何取之尽锱铢，用之如泥沙？\n使负栋之柱，多于南亩之农夫；\n架梁之椽，多于机上之工女；\n钉头磷磷，多于在庾之粟粒；\n瓦缝参差，多于周身之帛缕；\n直栏横槛，多于九土之城郭；\n管弦呕哑，多于市人之言语。\n使天下之人，不敢言而敢怒。\n独夫之心，日益骄固。\n戍卒叫，函谷举，楚人一炬，可怜焦土！\n呜呼！灭六国者六国也，非秦也；\n族秦者秦也，非天下也。\n嗟乎！使六国各爱其人，则足以拒秦；\n使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？\n秦人不暇自哀，而后人哀之；\n后人哀之而不鉴之，亦使后人而复哀后人也。","a":[["0","1586499890980"],["1","1596605919075"],["2","1596605926283"],["5","1596605941910"]],"v":["1597241754859034708"]}],"高中文言文必修（10篇）":[{"p":"《论语》十二章","au":"孔子及其弟子","dy":"先秦","c":"子曰：\"朝闻道，夕死可矣。\"\n子曰：\"君子喻于义，小人喻于利。\"\n子曰：\"见贤思齐焉，见不贤而内自省也。\"\n子曰：\"质胜文则野，文胜质则史。文质彬彬，然后君子。\"\n曾子曰：\"士不可以不弘毅，任重而道远。\"\n子曰：\"譬如为山，未成一篑，止，吾止也；譬如平地，虽覆一篑，进，吾往也。\"\n子曰：\"知者不惑，仁者不忧，勇者不惧。\"\n子贡问曰：\"有一言而可以终身行之者乎？\"子曰：\"其恕乎！己所不欲，勿施于人。\"\n子曰：\"小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。\"\n子曰：\"君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。","a":[["0","1592540363984"],["1","1596606338831"],["0","1597302870649"],["1","1596880652844"],["2","1596512165224"],["3","1598082152830"],["4","1597303586407"]],"v":["1597290477200018903"]},{"p":"六国论","au":"苏洵","dy":"宋","c":"六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。","a":[["0","1586499859686"],["1","1596605816566"],["2","1596605833035"],["5","1596605836514"]],"v":["1597278722959062411"]},{"p":"劝学","au":"荀子","dy":"先秦","c":"君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，𫐓使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。","a":[["0","1586499921074"],["1","1596606281109"],["2","1597241635000"],["5","1596606290140"]],"v":["1597278797596001219"]},{"p":"师  说","au":"韩愈","dy":"唐","c":"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。","a":[["0","1586500004555"],["1","1596606073673"],["2","1596606075822"],["5","1596606076631"]]},{"p":"师说","au":"韩愈","dy":"唐","c":"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。","a":[["0","1586500004555"],["1","1596606073673"],["2","1596606075822"],["5","1596606076631"]],"v":["1597241349987001035"]},{"p":"答司马谏议书","au":"王安石","dy":"宋","c":"某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反复不宜卤莽，故今具道所以，冀君实或见恕也。","a":[["0","1586499975326"],["1","1596605738944"],["2","1596605742972"],["5","1596605745460"]],"v":["1597238682648088080"]},{"p":"谏太宗十思疏","au":"魏征","dy":"唐","c":"臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。","a":[["0","1586499718088"],["1","1596606138951"],["2","1596606140172"],["5","1596606141388"]],"v":["1597235431703010182"]},{"p":"赤壁赋","au":"苏轼","dy":"宋","c":"壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。","a":[["0","1586499829990"],["1","1596605590050"],["2","1596605603801"],["5","1596605598538"]],"v":["1597280618830068957"]},{"p":"阿房宫赋","au":"杜牧","dy":"唐","c":"六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。","a":[["0","1586499890980"],["1","1596605919075"],["2","1596605926283"],["5","1596605941910"]],"v":["1597241754859034708"]},{"p":"屈原列传（节选）","au":"司马迁","dy":"汉","c":"屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。\n\"离骚\"者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。\n屈平正道直行，竭忠尽智，以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。\n《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。\n其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。","a":[["0","1586499949838"],["1","1596606220383"],["2","1596606227103"],["5","1596606228606"]]},{"p":"项脊轩志","au":"归有光","dy":"明","c":"项脊轩，旧南阁子也。\n室仅方丈，可容一人居。\n百年老屋，尘泥渗漉，雨泽下注；\n每移案，顾视无可置者。\n又北向，不能得日，日过午已昏。\n余稍为修葺，使不上漏。\n前辟四窗，垣墙周庭，以当南日，\n日影反照，室始洞然。\n又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。\n借书满架，偃仰啸歌，冥然兀坐，万籁有声；\n而庭阶寂寂，小鸟时来啄食，人至不去。\n三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。\n然余居于此，多可喜，亦多可悲。\n先是庭中通南北为一。\n迨诸父异爨，内外多置小门，墙往往而是。\n东犬西吠，客逾庖而宴，鸡栖于厅。\n庭中始为篱，已为墙，凡再变矣。\n家有老妪，尝居于此。\n妪，先大母婢也，乳二世，先妣抚之甚厚。\n室西连于中闺，先妣尝一至。\n妪每谓余曰：\"某所，而母立于兹。\"\n妪又曰：\"汝姊在吾怀，呱呱而泣；\n娘以指叩门扉曰：'儿寒乎？欲食乎？'\n吾从板外相为应答。\"\n语未毕，余泣，妪亦泣。\n余自束发读书轩中，一日，大母过余曰：\"吾儿，久不见若影，何竟日默默在此，大类女郎也？\"\n比去，以手阖门，自语曰：\"吾家读书久不效，儿之成，则可待乎！\"\n顷之，持一象笏至，曰：\"此吾祖太常公宣德间执此以朝，他日汝当用之！\"\n瞻顾遗迹，如在昨日，令人长号不自禁。\n轩东故尝为厨，人往，从轩前过。\n余扃牖而居，久之，能以足音辨人。\n轩凡四遭火，得不焚，殆有神护者。\n余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。\n吾妻归宁，述诸小妹语曰：\"闻姊家有阁子，且何谓阁子也？\"\n其后六年，吾妻死，室坏不修。\n其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。\n然自后余多在外，不常居。\n庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。","a":[["0","1586499792283"],["5","1596605511893"],["4","1596605528088"]]}],"高中文言文选修（12篇）":[{"p":"上枢密韩太尉书","au":"苏辙","dy":"宋","c":"太尉执事：辙生好为文，思之至深。以为文者气之所形，然文不可以学而能，气可以养而致。","a":[["0","1585912657761"],["1","1596608225935"],["2","1596608226128"],["3","1597455481601"]]},{"p":"兰亭集序","au":"王羲之","dy":"晋","c":"永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。","a":[["0","1585916493633"],["1","1596608517649"],["2","1596608513752"],["5","1596608514656"]],"v":["1597285917487088899"]},{"p":"古代文论选段（三）","au":"钟嵘","dy":"南北朝","c":"故诗有三义焉：一曰兴，二曰比，三曰赋。文已尽而意有余，兴也；因物喻志，比也；直书其事，寓言写物，赋也。","a":[["0","1597234129794"],["1","1597234131985"],["2","1597234139652"],["3","1597234132588"],["0","1597456285119"],["3","1597456271157"],["0","1597234288979"],["1","1597234293623"],["2","1597234301230"],["3","1597234293666"]]},{"p":"古代文论选段（六）","au":"刘勰","dy":"南北朝","c":"是以陶钧文思，贵在虚静，疏悰理秽，澡雪精神。","a":[["0","1597456285119"],["3","1597456271157"],["0","1597234288979"],["1","1597234293623"],["2","1597234301230"],["3","1597234293666"]]},{"p":"季氏将伐颛臾","au":"孔子及其弟子","dy":"先秦","c":"季氏将伐颛臾。冉有、季路见于孔子曰：\"季氏将有事于颛臾。\"孔子曰：\"求！无乃尔是过与？夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。何以伐为？","a":[["0","1592531847927"],["1","1596609146837"],["2","1596609152807"],["3","1597418566153"]]},{"p":"敢问夫子恶乎长","au":"孟子及其弟子","dy":"先秦","c":"\"敢问夫子恶乎长？\"曰：\"我知言，我善养吾浩然之气。","a":[["0","1585726347847"],["1","1596877674255"],["2","1596877683857"],["3","1592532799734"]]},{"p":"逍遥游（选段）","au":"庄子","dy":"先秦","c":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。","a":[["0","1586743775415"],["1","1596608758579"],["2","1596608763827"],["3","1597455573732"]],"v":["1597290389258036315"]},{"p":"《老子》八章","au":"老子","dy":"先秦","c":"第八章：上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。夫唯不争，故无尤。\n第十二章：五色令人目盲；五音令人耳聋；五味令人口爽；驰骋畋猎，令人心发狂；难得之货，令人行妨。是以圣人为腹不为目，故去彼取此。\n第十五章：古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者，不欲盈。夫唯不盈，故能蔽而新成。\n第二十二章：曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见，故明；不自是，故彰；不自伐，故有功；不自矜，故长。夫唯不争，故天下莫能与之争。古之所谓「曲则全」者，岂虚言哉！诚全而归之。\n第二十四章：跂者不立，跨者不行。自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。\n第二十七章：善行无辙迹，善言无瑕谪；善数不用筹策；善闭无关楗而不可开，善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物。是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。\n第三十三章：知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。\n第八十一章：信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积：既以为人，己愈有；既以与人，己愈多。天之道，利而不害；圣人之道，为而不争。","a":[["0","1592532674574"],["1","1597233765842"],["2","1597233840134"],["3","1592532676318"]]},{"p":"大学之道","au":"戴圣","dy":"汉《礼记》","c":"大学之道，在明明德，在亲民，在止于至善。\n知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始，知所先后，则近道矣。\n古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知。致知在格物。\n物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。\n自天子以至于庶人，壹是皆以修身为本。其本乱而末治者否矣，其所厚者薄，而其所薄者厚，未之有也！","a":[["0","1592531642691"],["1","1596609091236"],["2","1596609093207"],["3","1592531644106"]]},{"p":"中庸（节选）","au":"子思","dy":"先秦《礼记》","c":"喜怒哀乐之未发，谓之中；发而皆中节，谓之和。中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。\n博学之，审问之，慎思之，明辨之，笃行之。有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗思，思之弗得，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行之弗笃，弗措也。人一能之，己百之；人十能之，己千之。果能此道矣，虽愚必明，虽柔必强。","a":[["0","1592533148607"],["1","1596609043096"],["2","1596609042092"],["3","1592533149687"]]},{"p":"谏逐客书","au":"李斯","dy":"先秦","c":"臣闻吏议逐客，窃以为过矣。\n昔缪公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来丕豹、公孙支于晋。此五子者，不产于秦，而缪公用之，并国二十，遂霸西戎。\n孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。\n惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。\n昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实而秦无强大之名也。\n今陛下致昆山之玉，有随和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。\n臣闻地广者粟多，国大者人众，兵强则士勇。是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。\n今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓\"藉寇兵而赍盗粮\"者也。\n夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。今逐客以资敌国，损民以益雠，内自虚而外树怨于诸侯，求国无危，不可得也。","a":[["0","1585906237368"],["1","1596608587217"],["2","1596608589235"],["3","1597455312142"]]},{"p":"滕王阁序","au":"王勃","dy":"唐","c":"豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。\n时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿。临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。\n披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。\n遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人；萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？\n嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！\n勃，三尺微命，一介书生。无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。舍簪笏于百龄，奉晨昏于万里。非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？\n呜呼！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。请洒潘江，各倾陆海云尔。","a":[["0","1597411648864"],["1","1597411662896"],["2","1597418663088"],["3","1597455775850"]]},{"p":"古代文论选段（一）","au":"曹丕","dy":"三国","c":"文帝《典论·论文》曰：\n\"文以气为主，气之清浊有体，不可力强而致。\n譬诸音乐，曲度虽均，节奏同检，至于引气不齐，巧拙有素，虽在父兄，不能以移子弟。\"\n又曰：\"盖文章，经国之大业，不朽之盛事。\n年寿有时而尽，荣乐止乎其身，二者必至之常期，未若文章之无穷。\n是以古之作者，寄身于翰墨，见意于篇籍，不假良史之辞，不托飞驰之势，而声名自传于后。\"","a":[["0","1597456285119"],["3","1597456271157"],["0","1597234288979"],["1","1597234293623"],["2","1597234301230"],["3","1597234293666"]]},{"p":"古代文论选段（二）","au":"陆机","dy":"晋","c":"陆机《文赋》曰：\n\"观古今于须臾，抚四海于一瞬。\"\n又曰：\"谢朝花于已披，启夕秀于未振。\"\n又曰：\"思理为妙，神与物游。\"\n又曰：\"余观夫骏发之士，心有周密之虑，\n故能望景而兴，瞻物而思。\"","a":[["0","1597456285119"],["3","1597456271157"],["0","1597234288979"],["1","1597234293623"],["2","1597234301230"],["3","1597234293666"]]},{"p":"古代文论选段（四）","au":"刘勰","dy":"南朝","c":"刘勰《文心雕龙·神思》曰：\n\"古人云：'形在江海之上，心存魏阙之下。'神思之谓也。\n文之思也，其神远矣。\n故寂然凝虑，思理为妙；\n悄焉动容，视通万里；\n吟咏之间，吐纳珠玉之声；\n眉睫之前，卷舒风云之色；\n其思理之致乎！\"","a":[["0","1597456285119"],["3","1597456271157"],["0","1597234288979"],["1","1597234293623"],["2","1597234301230"],["3","1597234293666"]]},{"p":"古代文论选段（五）","au":"锺嵘","dy":"南朝","c":"锺嵘《诗品序》曰：\n\"气之动物，物之感人，故摇荡性情，形诸舞咏。\"\n又曰：\"若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，\n斯四候之感诸诗者也。\"\n又曰：\"五言居文词之要，是众作之有滋味者也。\"","a":[["0","1597456285119"],["3","1597456271157"],["0","1597234288979"],["1","1597234293623"],["2","1597234301230"],["3","1597234293666"]]},{"p":"《礼记·中庸》（节选）","au":"子思","dy":"先秦","c":"天命之谓性，率性之谓道，修道之谓教。\n道也者，不可须臾离也；可离，非道也。\n是故君子戒慎乎其所不睹，恐惧乎其所不闻。\n莫见乎隐，莫显乎微，故君子慎其独也。\n喜怒哀乐之未发，谓之中；发而皆中节，谓之和。\n中也者，天下之大本也；和也者，天下之达道也。\n致中和，天地位焉，万物育焉。","a":[["0","1592533148607"],["1","1596609043096"],["2","1596609042092"],["3","1592533149687"]]},{"p":"礼记·大学","au":"戴圣","dy":"汉","c":"大学之道，在明明德，在亲民，在止于至善。\n知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。\n物有本末，事有终始，知所先后，则近道矣。\n古之欲明明德于天下者，先治其国；\n欲治其国者，先齐其家；\n欲齐其家者，先修其身；\n欲修其身者，先正其心；\n欲正其心者，先诚其意；\n欲诚其意者，先致其知；\n致知在格物。\n物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，\n身修而后家齐，家齐而后国治，国治而后天下平。\n自天子以至于庶人，壹是皆以修身为本。\n其本乱而末治者否矣。\n其所厚者薄，而其所薄者厚，未之有也。","a":[["0","1592531642691"],["1","1596609091236"],["2","1596609093207"],["3","1592531644106"]]},{"p":"黄冈竹楼记","au":"王禹偁","dy":"宋","c":"黄冈之地多竹，大者如椽。\n竹工破之，刳去其节，用代陶瓦。\n比屋皆然，以其价廉而工省也。\n子城西北隅，雉堞圮毁，榛莽荒秽，因作小楼二间，与月波楼通。\n远吞山光，平挹江濑，幽阒辽夐，不可具状。\n夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。\n宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；\n宜围棋，子声丁丁然；宜投壶，矢声铮铮然：\n皆竹楼之所助也。\n公退之暇，被鹤氅，戴华阳巾，手执《周易》一卷，\n焚香默坐，消遣世虑。\n江山之外，第见风帆沙鸟、烟云竹树而已。\n及其足力衰，无所不造也。\n所赖君子安贫，达人知命，故凡为竹楼记云。","a":[["0","1585731718688"],["1","1596608295620"],["2","1596608299904"],["3","1597455406574"]]}],"高中诗词曲（40首）":[{"p":"临安春雨初霁","au":"陆游","dy":"宋","c":"世味年来薄似纱，谁令骑马客京华。\n小楼一夜听春雨，深巷明朝卖杏花。\n矮纸斜行闲作草，晴窗细乳戏分茶。\n素衣莫起风尘叹，犹及清明可到家。","a":[["0","1585672849956"],["1","1596611009899"],["2","1596611017097"],["3","1597314998875"]],"v":["1597301305110062033"]},{"p":"声声慢（寻寻觅觅）","au":"李清照","dy":"宋","c":"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急！\n雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？\n守着窗儿，独自怎生得黑！\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个愁字了得！","a":[["0","1585673606455"],["1","1596611163311"],["2","1596611157522"],["3","1597329803265"]],"v":["1598000163744007517"]},{"p":"客至","au":"杜甫","dy":"唐","c":"舍南舍北皆春水，\n但见群鸥日日来。\n花径不曾缘客扫，\n蓬门今始为君开。\n盘飧市远无兼味，\n樽酒家贫只旧醅。\n肯与邻翁相对饮，\n隔篱呼取尽余杯。","a":[["0","1585666973837"],["1","1596613984872"],["2","1596613992842"],["3","1597313832821"]],"v":["1597286154222003851"]},{"p":"山居秋暝","au":"王维","dy":"唐","c":"空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。","a":[["0","1585665423860"],["1","1597310448710"],["2","1597215243366"],["3","1597310885405"],["0","1591166032307"],["1","1596523974122"],["2","1596523979601"],["3","1591166034994"],["5","1596523984675"],["4","1596852749043"]]},{"p":"念奴娇·赤壁怀古","au":"苏轼","dy":"宋","c":"大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。","a":[["0","1585669993761"],["1","1596611566523"],["2","1596611567825"],["3","1597315517455"]],"v":["1597212253596010906"]},{"p":"扬州慢（淮左名都）","au":"姜夔","dy":"宋","c":"淮左名都，竹西佳处，解鞍少驻初程。\n过春风十里，尽荠麦青青。\n自胡马窥江去后，废池乔木，犹厌言兵。\n渐黄昏，清角吹寒，都在空城。\n杜郎俊赏，算而今重到须惊。\n纵豆蔻词工，青楼梦好，难赋深情。\n二十四桥仍在，波心荡，冷月无声。\n念桥边红药，年年知为谁生？","a":[["0","1585674177748"],["1","1596610511927"],["2","1596610513075"],["3","1597329675052"]]},{"p":"拟行路难（其四）","au":"鲍照","dy":"南北朝","c":"泻水置平地，各自东西南北流。\n人生亦有命，安能行叹复坐愁？\n酌酒以自宽，举杯断绝歌路难。\n心非木石岂无感？吞声踯躅不敢言。","a":[["0","1585673256956"],["1","1596617291831"],["2","1596617300743"],["3","1597310209908"]],"v":["1597295000176095712"]},{"p":"春江花月夜","au":"张若虚","dy":"唐","c":"春江潮水连海平，海上明月共潮生。\n滟滟随波千万里，何处春江无月明！\n江流宛转绕芳甸，月照花林皆似霰。\n空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。\n江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。\n不知江月待何人，但见长江送流水。","a":[["0","1585664853274"],["1","1596617169062"],["2","1596617160519"],["3","1597312271346"],["5","1596617153592"]],"v":["1597305730422013321"]},{"p":"望海潮（简）","au":"柳永","dy":"宋","c":"东南形胜，三吴都会，钱塘自古繁华。\n烟柳画桥，风帘翠幕，参差十万人家。","a":[["0","1592532386313"],["1","1596611984437"],["2","1596611988356"],["3","1597315622607"]]},{"p":"李凭箜篌引（简）","au":"李贺","dy":"唐","c":"吴丝蜀桐张高秋，空山凝云颓不流。\n江娥啼竹素女愁，李凭中国弹箜篌。","a":[["0","1592531983890"],["1","1596613494165"],["2","1596613501196"],["3","1597314729464"]],"v":["1597301211130077281"]},{"p":"梦游天姥吟留别（简）","au":"李白","dy":"唐","c":"海客谈瀛洲，烟涛微茫信难求；\n越人语天姥，云霞明灭或可睹。","a":[["0","1592532024482"],["1","1596614704689"],["2","1596614709904"],["3","1597312469839"]],"v":["1597305904611040146"]},{"p":"永遇乐·京口北固亭怀古","au":"辛弃疾","dy":"宋","c":"千古江山，英雄无觅，孙仲谋处。\n舞榭歌台，风流总被，雨打风吹去。\n斜阳草树，寻常巷陌，人道寄奴曾住。\n想当年，金戈铁马，气吞万里如虎。","a":[["0","1597413063492"],["1","1596610845688"],["2","1596610855086"],["3","1597376975699"],["5","1596610862489"]],"v":["1597239053937027801"]},{"p":"涉江采芙蓉","au":"佚名","dy":"汉","c":"涉江采芙蓉，兰泽多芳草。\n采之欲遗谁？所思在远道。\n还顾望旧乡，长路漫浩浩。\n同心而离居，忧伤以终老。","a":[["0","1591603065607"],["1","1597414037261"],["2","1596878080669"],["3","1597307982713"]],"v":["1597301003211005000"]},{"p":"登岳阳楼","au":"杜甫","dy":"唐","c":"昔闻洞庭水，今上岳阳楼。\n吴楚东南坼，乾坤日夜浮。\n亲朋无一字，老病有孤舟。\n戎马关山北，凭轩涕泗流。","a":[["0","1585667553449"],["1","1596613779178"],["2","1596878051207"],["3","1597314325755"]]},{"p":"登高","au":"杜甫","dy":"唐","c":"风急天高猿啸哀，\n渚清沙白鸟飞回。\n无边落木萧萧下，\n不尽长江滚滚来。\n万里悲秋常作客，\n百年多病独登台。\n艰难苦恨繁霜鬓，\n潦倒新停浊酒杯。","a":[["0","1585666272568"],["1","1596613923479"],["2","1596613929579"],["3","1597314171208"]],"v":["1597997405313033430"]},{"p":"短歌行（简）","au":"曹操","dy":"汉","c":"对酒当歌，人生几何！\n譬如朝露，去日苦多。\n慨当以慷，忧思难忘。\n何以解忧？唯有杜康。","a":[["0","1592531728668"],["1","1596617411681"],["2","1596617421703"],["3","1597308576734"]]},{"p":"离骚","au":"屈原","dy":"先秦","c":"帝高阳之苗裔兮，朕皇考曰伯庸。\n摄提贞于孟陬兮，惟庚寅吾以降。","a":[["0","1585672427587"],["1","1597306459241"],["2","1596877529490"],["5","1597307445229"]],"v":["1597280172142072692"]},{"p":"苏幕遮（简）","au":"周邦彦","dy":"宋","c":"燎沉香，消溽暑。\n鸟雀呼晴，侵晓窥檐语。","a":[["0","1592532352645"],["1","1596611239512"],["2","1596611239672"],["3","1597331556081"],["5","1596611243554"]]},{"p":"菩萨蛮·书江西造口壁（简）","au":"辛弃疾","dy":"宋","c":"郁孤台下清江水，\n中间多少行人泪。","a":[["0","1585671193728"],["1","1596610753458"],["2","1596610759961"],["3","1597331511326"]],"v":["1597238905776078490"]},{"p":"菩萨蛮（简）","au":"温庭筠","dy":"唐","c":"小山重叠金明灭，\n鬓云欲度香腮雪。","a":[["0","1592532237002"],["1","1596612919860"],["2","1596612927725"],["3","1597314673377"]],"v":["1597301122590003860"]},{"p":"虞美人","au":"李煜","dy":"五代","c":"春花秋月何时了？往事知多少。\n小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。\n问君能有几多愁？恰似一江春水向东流。","a":[["0","1585674693175"],["1","1596612467695"],["2","1596878115887"],["3","1597315679459"],["5","1596612480764"]],"v":["1598000318324035536"]},{"p":"蜀  相","au":"杜甫","dy":"唐","c":"丞相祠堂何处寻？\n锦官城外柏森森。\n映阶碧草自春色，\n隔叶黄鹂空好音。\n三顾频烦天下计，\n两朝开济老臣心。\n出师未捷身先死，\n长使英雄泪满襟。","a":[["0","1585669139004"],["1","1596614486241"],["2","1596614492247"],["3","1597313516292"]]},{"p":"蜀道难（简）","au":"李白","dy":"唐","c":"噫吁嚱，危乎高哉！\n蜀道之难，难于上青天！","a":[["0","1592532308303"],["1","1596614775523"],["2","1596614773051"],["3","1597311480463"]],"v":["1597300739702046847"]},{"p":"诗经-无衣（简）","au":"佚名","dy":"先秦","c":"岂曰无衣？与子同袍。\n王于兴师，修我戈矛。与子同仇！","a":[["0","1592532863611"],["1","1597304759749"],["2","1596617828866"],["3","1597303757894"]]},{"p":"诗经-静女（简）","au":"佚名","dy":"先秦","c":"静女其姝，俟我于城隅。\n爱而不见，搔首踟蹰。","a":[["0","1592532891726"],["1","1596618685252"],["2","1596618690983"],["3","1597304205785"],["5","1596618697339"]],"v":["1597996583735038739"]},{"p":"锦瑟","au":"李商隐","dy":"唐","c":"锦瑟无端五十弦，\n一弦一柱思华年。\n庄生晓梦迷蝴蝶，\n望帝春心托杜鹃。\n沧海月明珠有泪，\n蓝田日暖玉生烟。\n此情可待成追忆？\n只是当时已惘然。","a":[["0","1585668662771"],["1","1596612569507"],["2","1596612576177"],["3","1597315728541"],["5","1596612581276"]],"v":["1598003383029091532"]},{"p":"青玉案·元夕","au":"辛弃疾","dy":"宋","c":"东风夜放花千树。\n更吹落、星如雨。\n宝马雕车香满路。\n凤箫声动，玉壶光转，\n一夜鱼龙舞。\n蛾儿雪柳黄金缕，\n笑语盈盈暗香去。\n众里寻他千百度，\n蓦然回首，那人却在，\n灯火阑珊处。","a":[["0","1585670817418"],["1","1596610692833"],["2","1596610691788"],["3","1597316080002"]],"v":["1597238979790099248"]},{"p":"鹊桥仙","au":"秦观","dy":"宋","c":"纤云弄巧，飞星传恨，银汉迢迢暗度。\n金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。\n两情若是久长时，又岂在朝朝暮暮。","a":[["0","1585670427924"],["1","1596611324938"],["2","1596611329253"],["3","1597315339573"],["0","1591171014844"],["1","1596510911353"],["2","1596510937905"],["3","1598081214130"]],"v":["1597300874510010047"]},{"p":"归园田居·其一","au":"陶渊明","dy":"晋","c":"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。\n暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。\n户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。","a":[["0","1585671945559"],["1","1596617353401"],["2","1597413563590"],["3","1597309681888"]]},{"p":"将进酒","au":"李白","dy":"唐","c":"君不见，黄河之水天上来，奔流到海不复回。\n君不见，高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我倾耳听。钟鼓馔玉不足贵，但愿长醉不愿醒。\n古来圣贤皆寂寞，惟有饮者留其名。陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须沽取对君酌。五花马、千金裘，呼儿将出换美酒，与尔同销万古愁。","a":[["0","1585668054679"],["1","1596614634202"],["2","1596614625986"],["3","1597315895062"],["5","1596614623582"]]},{"p":"燕歌行","au":"高适","dy":"唐","c":"汉家烟尘在东北，汉将辞家破残贼。男儿本自重横行，天子非常赐颜色。\n摐金伐鼓下榆关，旌旆逶迤碣石间。校尉羽书飞瀚海，单于猎火照狼山。\n山川萧条极边土，胡骑凭陵杂风雨。战士军前半死生，美人帐下犹歌舞。\n大漠穷秋塞草腓，孤城落日斗兵稀。身当恩遇常轻敌，力尽关山未解围。\n铁衣远戍辛勤久，玉箸应啼别离后。少妇城南欲断肠，征人蓟北空回首。\n边庭飘飖那可度，绝域苍茫更何有。杀气三时作阵云，寒声一夜传刁斗。\n相看白刃血纷纷，死节从来岂顾勋。君不见沙场征战苦，至今犹忆李将军。","a":[["0","1592532423832"],["1","1596614565547"],["2","1596614567879"]]},{"p":"琵琶行（并序）","au":"白居易","dy":"唐","c":"元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。\n浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁？琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六幺》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流冰下难。冰泉冷涩弦凝绝，凝绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。东船西舫悄无言，唯见江心秋月白。\n沉吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名属教坊第一部。曲罢曾教善才服，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头银篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。夜深忽梦少年事，梦啼妆泪红阑干。\n我闻琵琶已叹息，又闻此语重唧唧。同是天涯沦落人，相逢何必曾相识！我从去年辞帝京，谪居卧病浔阳城。浔阳地僻无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物？杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛？呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作《琵琶行》。\n感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多？江州司马青衫湿。","a":[["0","1592532102060"],["1","1597315010162"],["2","1603109242997"],["3","1597314847817"]]},{"p":"菩萨蛮·小山重叠金明灭","au":"温庭筠","dy":"唐","c":"小山重叠金明灭，鬓云欲度香腮雪。\n懒起画蛾眉，弄妆梳洗迟。\n照花前后镜，花面交相映。\n新帖绣罗襦，双双金鹧鸪。","a":[["0","1592532237002"],["1","1596612919860"],["2","1596612927725"],["3","1597314673377"]]},{"p":"桂枝香·金陵怀古","au":"王安石","dy":"宋","c":"登临送目，正故国晚秋，天气初肃。\n千里澄江似练，翠峰如簇。\n归帆去棹残阳里，背西风，酒旗斜矗。\n彩舟云淡，星河鹭起，画图难足。\n念往昔，繁华竞逐，叹门外楼头，悲恨相续。\n千古凭高对此，谩嗟荣辱。\n六朝旧事随流水，但寒烟衰草凝绿。\n至今商女，时时犹唱，后庭遗曲。","a":[["0","1592531772161"],["1","1596611913050"],["2","1596611917288"],["3","1597315807628"]]},{"p":"江城子·乙卯正月二十日夜记梦","au":"苏轼","dy":"宋","c":"十年生死两茫茫，不思量，自难忘。\n千里孤坟，无处话凄凉。\n纵使相逢应不识，尘满面，鬓如霜。\n夜来幽梦忽还乡，小轩窗，正梳妆。\n相顾无言，惟有泪千行。\n料得年年肠断处，明月夜，短松冈。","a":[["0","1592531884654"],["1","1596611646714"],["2","1596611648713"],["3","1597315576611"],["5","1596611648582"],["4","1596861620701"]]},{"p":"登快阁","au":"黄庭坚","dy":"宋","c":"痴儿了却公家事，快阁东西倚晚晴。\n落木千山天远大，澄江一道月分明。\n朱弦已为佳人绝，青眼聊因美酒横。\n万里归船弄长笛，此心吾与白鸥盟。","a":[["0","1592531692471"],["1","1596611380632"],["2","1596611387884"],["3","1597315425940"]]},{"p":"书愤","au":"陆游","dy":"宋","c":"早岁那知世事艰，中原北望气如山。\n楼船夜雪瓜洲渡，铁马秋风大散关。\n塞上长城空自许，镜中衰鬓已先斑。\n出师一表真名世，千载谁堪伯仲间！","a":[["0","1585669555439"],["1","1596611075911"],["2","1596611083864"],["3","1597315864839"]]},{"p":"念奴娇·过洞庭","au":"张孝祥","dy":"宋","c":"洞庭青草，近中秋，更无一点风色。\n玉鉴琼田三万顷，著我扁舟一叶。\n素月分辉，明河共影，表里俱澄澈。\n悠然心会，妙处难与君说。\n应念岭海经年，孤光自照，肝肺皆冰雪。\n短发萧骚襟袖冷，稳泛沧浪空阔。\n尽挹西江，细斟北斗，万象为宾客。\n扣舷独啸，不知今夕何夕。","a":[["0","1592532059905"],["1","1596610935512"],["2","1596610941922"],["3","1597329889933"]]},{"p":"贺新郎·国脉微如缕","au":"刘克庄","dy":"宋","c":"国脉微如缕。问长缨何时入手，缚将戎主？\n未必人间无好汉，谁与宽些尺度？\n试看取当年韩五。岂有谷城公付授，也不干曾遇骊山母。\n谈笑起，两河路。\n少时棋柝曾联句。叹而今登楼揽镜，事机频误。\n闻说北风吹面急，边上冲梯屡舞。\n君莫道投鞭虚语。自古一贤能制难，有金汤便可无张许？\n快投笔，莫题柱。","a":[["0","1592531801292"],["1","1596610575229"],["2","1596610581038"],["3","1597314850486"]]},{"p":"长亭送别（端正好）","au":"王实甫","dy":"元","c":"（端正好）碧云天，黄花地，西风紧，北雁南飞。\n晓来谁染霜林醉？总是离人泪。\n（滚绣球）恨相见得迟，怨归去得疾。柳丝长玉骢难系，恨不倩疏林挂住斜晖。\n马儿迍迍的行，车儿快快的随，却告了相思回避，破题儿又早别离。\n听得道一声去也，松了金钏；遥望见十里长亭，减了玉肌。此恨谁知！","a":[["0","1592532502022"],["1","1596609370380"],["2","1596609378432"],["5","1597413124739"]]},{"p":"朝天子·咏喇叭","au":"王磐","dy":"明","c":"喇叭，唢呐，\n曲儿小腔儿大。\n官船来往乱如麻，\n全仗你抬声价。\n军听了军愁，\n民听了民怕。\n哪里去辨甚么真共假？\n眼见的吹翻了这家，\n吹伤了那家，\n只吹的水尽鹅飞罢！","a":[["0","1584364636103"],["1","1596598837015"],["2","1596598889637"]]}]};

  }
}

/* 迷你播放器控制 */
function updateMiniPlayer(playing){
  const mp = document.getElementById('miniPlayer');
  if (!currentAudioUrl) {mp.classList.remove('show');return;}
  mp.classList.add('show');
  document.getElementById('mpTitle').textContent = currentAudioMeta.title || '未知';
  document.getElementById('mpSub').textContent = currentAudioMeta.sub || '';
  document.getElementById('mpPlayBtn').textContent = playing ? '⏸' : '▶';
  document.getElementById('mpLoopBtn').classList.toggle('active', isLooping);
}

function togglePlayPause(){
  if (!currentAudioUrl) return;
  if (player.paused) {
    player.play();
    if (currentPlaying) {currentPlaying.classList.add('playing');currentPlaying.querySelector('.btn-state').textContent = '⏸';}
    document.getElementById('mpPlayBtn').textContent = '⏸';
  } else {
    player.pause();
    if (currentPlaying) {currentPlaying.classList.remove('playing');currentPlaying.querySelector('.btn-state').textContent = '▶';}
    document.getElementById('mpPlayBtn').textContent = '▶';
  }
}

function toggleLoop(){
  isLooping = !isLooping;
  player.loop = isLooping;
  document.getElementById('mpLoopBtn').classList.toggle('active', isLooping);
}

function stopAudio(){
  player.pause();
  player.currentTime = 0;
  player.src = '';
  if (currentPlaying) {
    currentPlaying.classList.remove('playing');
    const state = currentPlaying.querySelector('.btn-state');
    if (state) state.textContent = '▶';
    currentPlaying = null;
  }
  currentAudioUrl = '';
  document.getElementById('miniPlayer').classList.remove('show');
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = 'none';
  }
}

function seekAudio(e){
  if (!player.duration) return;
  const bar = document.getElementById('mpProgress');
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  player.currentTime = pct * player.duration;
}

function fmtTime(s){
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* Media Session API — 后台/锁屏控制 */
function setupMediaSession(title, sub){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: title || '吟诵',
    artist: sub || '吟诵学堂',
    album: '吟诵学堂',
  });
  navigator.mediaSession.setActionHandler('play', () => {player.play();});
  navigator.mediaSession.setActionHandler('pause', () => {player.pause();});
  navigator.mediaSession.setActionHandler('stop', () => {stopAudio();});
  navigator.mediaSession.setActionHandler('seekbackward', (d) => {player.currentTime = Math.max(0, player.currentTime - (d.seekOffset || 10));});
  navigator.mediaSession.setActionHandler('seekforward', (d) => {player.currentTime = Math.min(player.duration, player.currentTime + (d.seekOffset || 10));});
}

/* 播放进度更新 */
player.addEventListener('timeupdate', () => {
  if (!currentAudioUrl) return;
  const pct = player.duration ? (player.currentTime / player.duration * 100) : 0;
  const bar = document.getElementById('mpProgressBar');
  if (bar) bar.style.width = pct + '%';
  const time = document.getElementById('mpTime');
  if (time) time.textContent = fmtTime(player.currentTime) + ' / ' + fmtTime(player.duration);
});

player.addEventListener('ended', () => {
  if (!isLooping) {
    if (currentPlaying) {
      currentPlaying.classList.remove('playing');
      const state = currentPlaying.querySelector('.btn-state');
      if (state) state.textContent = '▶';
      currentPlaying = null;
    }
    currentAudioUrl = '';
    document.getElementById('miniPlayer').classList.remove('show');
  }
});

player.addEventListener('play', () => {
  document.querySelectorAll('.video-player').forEach(v => {if (!v.paused) v.pause();});
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  document.getElementById('mpPlayBtn').textContent = '⏸';
});

player.addEventListener('pause', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  document.getElementById('mpPlayBtn').textContent = '▶';
});

/* ===== 视频控制 ===== */
function initVideoPlayers(){
  document.querySelectorAll('.video-player').forEach(video => {
    const wrapper = video.closest('.video-wrapper');
    const overlay = wrapper ? wrapper.querySelector('.video-overlay') : null;
    video.addEventListener('play', () => {
      // 断掉所有音频
      player.pause();
      if (currentPlaying) {
        currentPlaying.classList.remove('playing');
        const state = currentPlaying.querySelector('.btn-state');
        if (state) state.textContent = '▶';
        currentPlaying = null;
      }
      // 断掉其他视频
      document.querySelectorAll('.video-player').forEach(v => {if (v !== video && !v.paused) v.pause();});
      if (wrapper) wrapper.classList.add('playing');
    });
    video.addEventListener('pause', () => {if (wrapper) wrapper.classList.remove('playing');});
    if (overlay) overlay.addEventListener('click', () => video.play());
  });
}

function getCatalogPoems(cat){

function renderCatalogList(){

        bar.style.display = 'none';

      const catTag = lastCatalog.cat === '__all__' ? `<span class="ci-name" style="font-size:14px;">${p.poem}</span>` : `<span class="ci-name">${p.poem}</span>`;
      return `<div class="cat-item" onclick="openDetail('${p.cat}','${p.poem.replace(/'/g,"\\'")}')">
        ${lastCatalog.cat === '__all__' ? `<div style="display:flex;flex-direction:column;gap:2px;"><span class="ci-name">${p.poem}</span><span style="font-size:11px;color:var(--ink-light);">${shortC}</span></div>` : `<span class="ci-name">${p.poem}</span>`}
        <div class="ci-meta">${v}<span class="ci-arrow">›</span></div>
      </div>`;
    }).join('');
  }

  const pg = document.getElementById('catPagination');

  } else {

      <span class="pg-info">第 ${lastCatalog.page + 1}/${pages} 页 · ${total} 首</span>
      <button onclick="changePage(${lastCatalog.page + 1})" ${lastCatalog.page >= pages - 1 ? 'disabled' : ''}>下一页 →</button>
    `;
  }
}
